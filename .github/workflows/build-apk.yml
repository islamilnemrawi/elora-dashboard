name: Elora Dashboard APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Elora Dashboard v1.8.5
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract Elora project
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "========================================"
          echo "ELORA DASHBOARD v1.8.5"
          echo "========================================"

          ZIP_FILE=$(find . \
            -type f \
            -iname 'Elora_Dashboard*.zip' \
            -not -path './android-project/*' \
            | sort \
            | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Elora Dashboard ZIP was not found."
            echo ""
            find . -maxdepth 4 -type f -print
            exit 1
          fi

          echo "Found:"
          echo "$ZIP_FILE"

          rm -rf android-project
          mkdir -p android-project

          echo "Extracting..."
          unzip -q "$ZIP_FILE" -d android-project

          SETTINGS_FILE=$(find android-project \
            -type f \
            \( \
              -name "settings.gradle" \
              -o \
              -name "settings.gradle.kts" \
            \) \
            | sort \
            | head -n 1)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle not found."
            find android-project -maxdepth 7 -type f -print
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"

          echo "Project:"
          echo "$PROJECT_DIR"

          if [ ! -f "$PROJECT_DIR/app/build.gradle" ] && \
             [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "ERROR: app/build.gradle not found."
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml" ]; then
            echo "ERROR: AndroidManifest.xml not found."
            exit 1
          fi

          echo "Project structure: OK"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        shell: bash
        run: |
          set -Eeuo pipefail

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
          cache-disabled: true

      - name: Verify project
        shell: bash
        run: |
          set -Eeuo pipefail

          cd "$PROJECT_DIR"

          echo "========================================"
          echo "VERIFYING PROJECT"
          echo "========================================"

          test -f settings.gradle || \
          test -f settings.gradle.kts

          test -f build.gradle || \
          test -f build.gradle.kts

          test -f app/src/main/AndroidManifest.xml

          if [ -f app/src/main/assets/firebase-config.json ]; then
            echo "Firebase: OK"
          else
            echo "Firebase config not found."
          fi

          if [ -f app/src/main/assets/supabase-config.js ]; then
            echo "Supabase: OK"
          else
            echo "Supabase config not found."
          fi

      - name: Build APK
        shell: bash
        run: |
          set -Eeuo pipefail

          cd "$PROJECT_DIR"

          echo "========================================"
          echo "BUILDING ELORA DASHBOARD v1.8.5"
          echo "========================================"

          gradle \
            --no-daemon \
            --stacktrace \
            --warning-mode all \
            clean \
            assembleDebug

          echo ""
          echo "GRADLE BUILD FINISHED."

      - name: Verify APK
        shell: bash
        run: |
          set -Eeuo pipefail

          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          echo "========================================"
          echo "VERIFYING APK"
          echo "========================================"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated."

            find "$PROJECT_DIR/app/build/outputs" \
              -type f \
              -print 2>/dev/null || true

            exit 1
          fi

          if [ ! -s "$APK" ]; then
            echo "ERROR: APK is empty."
            exit 1
          fi

          echo ""
          echo "APK SUCCESSFULLY GENERATED:"
          ls -lh "$APK"

      - name: Prepare APK
        shell: bash
        run: |
          set -Eeuo pipefail

          mkdir -p release

          cp \
            "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" \
            "release/Elora-Dashboard-v1.8.5.apk"

          echo ""
          echo "Release APK:"
          ls -lh release/Elora-Dashboard-v1.8.5.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Elora-Dashboard-v1.8.5
          path: release/Elora-Dashboard-v1.8.5.apk
          if-no-files-found: error
          retention-days: 30

      - name: SUCCESS
        shell: bash
        run: |
          echo ""
          echo "========================================"
          echo "ELORA DASHBOARD v1.8.5"
          echo "BUILD SUCCESSFUL"
          echo "========================================"
