name: Elora Dashboard - Build APK v1.4.0

on:
  workflow_dispatch:

  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: elora-dashboard-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Elora Dashboard APK
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # 1. Checkout
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. Java 17
      # --------------------------------------------------
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # --------------------------------------------------
      # 3. Android SDK
      # --------------------------------------------------
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # --------------------------------------------------
      # 4. Gradle 8.7
      # --------------------------------------------------
      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
          cache-disabled: true

      # --------------------------------------------------
      # 5. Find uploaded ZIP
      # --------------------------------------------------
      - name: Locate Elora Dashboard ZIP
        shell: bash
        run: |
          set -e

          echo "Searching for Dashboard ZIP..."

          ZIP_FILE=$(find . \
            -type f \
            -iname "*.zip" \
            ! -path "./.git/*" \
            | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "::error::Elora Dashboard ZIP was not found."
            echo "Repository structure:"
            find . -maxdepth 5 -type f | sort
            exit 1
          fi

          echo "Found:"
          echo "$ZIP_FILE"

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      # --------------------------------------------------
      # 6. Extract project
      # --------------------------------------------------
      - name: Extract Dashboard project
        shell: bash
        run: |
          set -e

          rm -rf android-project
          mkdir -p android-project

          unzip -q "$ZIP_FILE" -d android-project

          echo ""
          echo "Extracted Dashboard project:"
          find android-project \
            -maxdepth 8 \
            -type f \
            | sort \
            | head -500

      # --------------------------------------------------
      # 7. Locate Gradle project
      # --------------------------------------------------
      - name: Locate Android Gradle project
        shell: bash
        run: |
          set -e

          SETTINGS_FILE=$(find android-project \
            -type f \
            \
              -name "settings.gradle" \
              -o \
              -name "settings.gradle.kts" \
            \
            | head -n 1)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "::error::settings.gradle was not found."

            echo ""
            echo "Full extracted structure:"
            find android-project \
              -maxdepth 10 \
              -type f \
              | sort

            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo ""
          echo "Android project directory:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # --------------------------------------------------
      # 8. Verify important Elora files
      # --------------------------------------------------
      - name: Verify Elora project files
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "Checking Elora project..."

          test -f "settings.gradle" \
            || test -f "settings.gradle.kts"

          test -d "app"

          test -f "app/build.gradle" \
            || test -f "app/build.gradle.kts"

          test -f "app/src/main/assets/Elora_Dashboard.html"

          echo "Elora_Dashboard.html: OK"

          if [ -f "app/src/main/assets/index.html" ]; then
            echo "index.html: OK"
          fi

          if [ -f "app/src/main/assets/dashboard.js" ]; then
            echo "dashboard.js: OK"
          fi

          if [ -f "app/src/main/assets/supabase-config.js" ]; then
            echo "supabase-config.js: OK"
          fi

          if [ -f "worker/index.js" ]; then
            echo "R2 Worker: OK"
          fi

          echo ""
