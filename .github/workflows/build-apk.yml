name: Build Elora Dashboard APK

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: elora-dashboard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Elora Dashboard
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
          cache-disabled: true

      - name: Find Android project
        shell: bash
        run: |
          echo "Searching for Gradle project..."

          SETTINGS_FILE=$(find . \
            -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -not -path "./.git/*" \
            | head -n 1)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle was not found."
            echo "Project files:"
            find . -maxdepth 4 -type f | sort
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo "Gradle settings found:"
          echo "$SETTINGS_FILE"

          echo "Android project directory:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Show project structure
        run: |
          echo "Building from:"
          pwd
          echo "$PROJECT_DIR"

          echo "Project contents:"
          ls -lah "$PROJECT_DIR"

          echo "Gradle files:"
          find "$PROJECT_DIR" \
            -maxdepth 2 \
            -type f \
            \( -name "build.gradle" -o -name "build.gradle.kts" -o -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -print

      - name: Clean project
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle --no-daemon clean

      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle \
            --no-daemon \
            --stacktrace \
            --warning-mode all \
            :app:assembleDebug

      - name: Verify APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk

          echo "APK successfully created:"
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Prepare APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          mkdir -p release

          cp \
            app/build/outputs/apk/debug/app-debug.apk \
            release/Elora-Dashboard-v1.3.0-debug.apk

          ls -lh release/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Elora-Dashboard-v1.3.0-Debug
          path: ${{ env.PROJECT_DIR }}/release/Elora-Dashboard-v1.3.0-debug.apk
          if-no-files-found: error
          retention-days: 30
