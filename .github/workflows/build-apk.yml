name: Build Elora Dashboard APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Signed Elora Dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:

      - name: Checkout
        uses: actions/checkout@v6

      - name: Find Elora Dashboard ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE=""

          if [ -f "Elora_Dashboard_v1_9_10_PRO_FUNCTIONAL_FIX.zip" ]; then
            ZIP_FILE="Elora_Dashboard_v1_9_10_PRO_FUNCTIONAL_FIX.zip"
          else
            ZIP_FILE=$(find . -type f \
              -name "Elora_Dashboard_v1_9_10_PRO_FUNCTIONAL_FIX.zip" \
              | head -n 1 || true)
          fi

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Elora Dashboard ZIP was not found."
            echo "Available files:"
            find . -maxdepth 5 -type f -print
            exit 1
          fi

          echo "Using:"
          echo "$ZIP_FILE"

          echo "ELORA_ZIP=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Extract Elora Dashboard
        shell: bash
        run: |
          set -euo pipefail

          rm -rf android-project
          mkdir -p android-project

          unzip -q "$ELORA_ZIP" -d android-project

          echo "Extracted project:"
          find android-project -maxdepth 5 -type f \
            \( -name "settings.gradle" \
            -o -name "settings.gradle.kts" \
            -o -name "build.gradle" \
            -o -name "build.gradle.kts" \
            -o -name "gradlew" \) \
            -print

      - name: Detect Android Project
        shell: bash
        run: |
          set -euo pipefail

          SETTINGS_FILE=$(find android-project \
            -type f \
            -name "settings.gradle" \
            | head -n 1 || true)

          if [ -z "$SETTINGS_FILE" ]; then
            SETTINGS_FILE=$(find android-project \
              -type f \
              -name "settings.gradle.kts" \
              | head -n 1 || true)
          fi

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle was not found."
            echo "Full extracted tree:"
            find android-project -maxdepth 8 -type f -print
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo "Android project directory:"
          echo "$PROJECT_DIR"

          if [ ! -f "$PROJECT_DIR/app/build.gradle" ] &&
             [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "ERROR: app/build.gradle was not found."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses \
            >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Prepare Release Keystore
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ELORA_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          if [ -z "$KEYSTORE_B64" ]; then
            echo "ERROR: ELORA_KEYSTORE_BASE64 is missing."
            exit 1
          fi

          printf '%s' "$KEYSTORE_B64" \
            | base64 --decode \
            > "$RUNNER_TEMP/elora-release.keystore"

          test -s "$RUNNER_TEMP/elora-release.keystore"

          echo "ELORA_KEYSTORE_FILE=$RUNNER_TEMP/elora-release.keystore" \
            >> "$GITHUB_ENV"

      - name: Build Release APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          chmod +x gradlew || true

          echo "Building Elora Dashboard..."

          gradle \
            --no-daemon \
            --stacktrace \
            clean \
            assembleRelease

          echo "APK files:"
          find . -type f -name "*.apk" -print

      - name: Locate Unsigned APK
        shell: bash
        run: |
          set -euo pipefail

          UNSIGNED_APK=$(find "$PROJECT_DIR" \
            -type f \
            -name "*-unsigned.apk" \
            | head -n 1 || true)

          if [ -z "$UNSIGNED_APK" ]; then
            echo "ERROR: Unsigned APK was not found."

            find "$PROJECT_DIR" \
              -type f \
              -name "*.apk" \
              -print || true

            exit 1
          fi

          echo "Unsigned APK:"
          echo "$UNSIGNED_APK"

          echo "ELORA_UNSIGNED_APK=$UNSIGNED_APK" \
            >> "$GITHUB_ENV"

      - name: Sign Release APK
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ELORA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ELORA_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ELORA_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          SIGNED_APK="$RUNNER_TEMP/Elora-Dashboard-PRO.apk"

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks "$ELORA_KEYSTORE_FILE" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out "$SIGNED_APK" \
            "$ELORA_UNSIGNED_APK"

          test -s "$SIGNED_APK"

          echo "ELORA_SIGNED_APK=$SIGNED_APK" \
            >> "$GITHUB_ENV"

          ls -lh "$SIGNED_APK"

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            verify \
            --verbose \
            "$ELORA_SIGNED_APK"

          echo "APK signature verified successfully."

      - name: Show APK Information
        shell: bash
        run: |
          set -euo pipefail

          echo "Final APK:"
          ls -lh "$ELORA_SIGNED_APK"

          "$ANDROID_HOME/build-tools/35.0.0/aapt" \
            dump badging \
            "$ELORA_SIGNED_APK" \
            | grep -E \
              "package:|versionCode=|versionName=" \
            | head -n 5 || true

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: Elora-Dashboard-PRO-APK
          path: ${{ env.ELORA_SIGNED_APK }}
          if-no-files-found: error
          retention-days: 30
