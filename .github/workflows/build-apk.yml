name: Build Elora Dashboard APK v1.4.0

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Elora Dashboard APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
          cache-disabled: true

      - name: Verify Project
        run: |
          set -e

          echo "Checking project files..."

          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml

          grep -q "versionName '1.4.0'" app/build.gradle
          grep -q "versionCode 5" app/build.gradle

          echo "Project verified successfully."

      - name: Clean
        run: |
          gradle --no-daemon clean

      - name: Build APK
        run: |
          gradle --no-daemon \
            --stacktrace \
            --warning-mode all \
            :app:assembleDebug

      - name: Verify APK
        run: |
          set -e

          APK="app/build/outputs/apk/debug/app-debug.apk"

          echo "Checking APK..."
          test -f "$APK"

          echo "APK found:"
          ls -lh "$APK"

          mkdir -p release

          cp "$APK" \
            "release/Elora-Dashboard-v1.4.0-debug.apk"

          echo "Final APK:"
          ls -lh "release/Elora-Dashboard-v1.4.0-debug.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Elora-Dashboard-v1.4.0
          path: release/Elora-Dashboard-v1.4.0-debug.apk
          if-no-files-found: error
          retention-days: 30
