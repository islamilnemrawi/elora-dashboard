name: Build ELORA Dashboard APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Signed Release APK
    runs-on: ubuntu-latest

    steps:
      # --------------------------------------------------
      # 1) Checkout
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v6

      # --------------------------------------------------
      # 2) Java 17
      # --------------------------------------------------
      - name: Setup JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      # --------------------------------------------------
      # 3) Android SDK
      # --------------------------------------------------
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      # --------------------------------------------------
      # 4) Find ELORA source ZIP
      # --------------------------------------------------
      - name: Find ELORA source ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP="$(find . -maxdepth 3 -type f \
            \( -name 'Elora_Dashboard_v1_9_11_PRO_FINAL.zip' \
            -o -name '*V1_9_11*PRO*.zip' \
            -o -name '*dashboard*.zip' \
            \) | head -n 1)"

          if [ -z "$ZIP" ]; then
            echo "ERROR: ELORA Dashboard ZIP was not found."
            echo "Available files:"
            find . -maxdepth 3 -type f | sort
            exit 1
          fi

          echo "Using ZIP:"
          echo "$ZIP"

          echo "ELORA_ZIP=$ZIP" >> "$GITHUB_ENV"

      # --------------------------------------------------
      # 5) Extract source
      # --------------------------------------------------
      - name: Extract ELORA source
        shell: bash
        run: |
          set -euo pipefail

          rm -rf elora-build
          mkdir -p elora-build

          unzip -q "$ELORA_ZIP" -d elora-build

          echo "Extracted project:"
          find elora-build -maxdepth 4 -type f | sort | head -300

      # --------------------------------------------------
      # 6) Detect Android project root
      # --------------------------------------------------
      - name: Detect Android project root
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_ROOT="$(find "$GITHUB_WORKSPACE/elora-build" \
            -type f -name 'settings.gradle' \
            -o -type f -name 'settings.gradle.kts' \
            | head -n 1)"

          if [ -z "$PROJECT_ROOT" ]; then
            echo "ERROR: settings.gradle was not found."
            exit 1
          fi

          PROJECT_ROOT="$(dirname "$PROJECT_ROOT")"

          echo "Android project root:"
          echo "$PROJECT_ROOT"

          if [ ! -f "$PROJECT_ROOT/app/build.gradle" ] && \
             [ ! -f "$PROJECT_ROOT/app/build.gradle.kts" ]; then
            echo "ERROR: Android app module was not found."
            find "$PROJECT_ROOT" -maxdepth 3 -type f | sort
            exit 1
          fi

          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"

      # --------------------------------------------------
      # 7) Install Gradle 8.9
      # --------------------------------------------------
      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      # --------------------------------------------------
      # 8) Create Gradle Wrapper
      # --------------------------------------------------
      - name: Create Gradle Wrapper
        shell: bash
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          set -euo pipefail

          echo "Creating Gradle Wrapper..."

          gradle wrapper \
            --gradle-version 8.9 \
            --distribution-type bin

          chmod +x gradlew

          echo "Wrapper created successfully."

          ls -la gradlew
          ls -la gradle/wrapper/

      # --------------------------------------------------
      # 9) Verify project
      # --------------------------------------------------
      - name: Verify Android project
        shell: bash
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          set -euo pipefail

          echo "Gradle:"
          ./gradlew --version

          echo
          echo "Projects:"
          ./gradlew projects --no-daemon

      # --------------------------------------------------
      # 10) Prepare signing
      # --------------------------------------------------
      - name: Prepare release signing
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/elora-signing"

          echo "${{ secrets.ELORA_KEYSTORE_BASE64 }}" \
            | base64 --decode \
            > "$RUNNER_TEMP/elora-signing/elora-release.keystore"

          test -s "$RUNNER_TEMP/elora-signing/elora-release.keystore"

          echo "KEYSTORE_FILE=$RUNNER_TEMP/elora-signing/elora-release.keystore" \
            >> "$GITHUB_ENV"

      # --------------------------------------------------
      # 11) Build signed Release APK
      # --------------------------------------------------
      - name: Build Release APK
        shell: bash
        working-directory: ${{ env.PROJECT_ROOT }}
        env:
          ELORA_KEYSTORE_FILE: ${{ env.KEYSTORE_FILE }}
          ELORA_KEYSTORE_PASSWORD: ${{ secrets.ELORA_KEYSTORE_PASSWORD }}
          ELORA_KEY_ALIAS: ${{ secrets.ELORA_KEY_ALIAS }}
          ELORA_KEY_PASSWORD: ${{ secrets.ELORA_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          ./gradlew \
            clean \
            :app:assembleRelease \
            --no-daemon \
            --stacktrace

      # --------------------------------------------------
      # 12) Locate APK
      # --------------------------------------------------
      - name: Locate Release APK
        shell: bash
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          set -euo pipefail

          APK="$(find app/build/outputs/apk/release \
            -type f -name '*.apk' \
            | head -n 1)"

          if [ -z "$APK" ]; then
            echo "ERROR: Release APK was not generated."

            echo "APK directory:"
            find app/build/outputs -maxdepth 6 -type f 2>/dev/null || true

            exit 1
          fi

          echo "APK generated:"
          echo "$APK"

          mkdir -p "$GITHUB_WORKSPACE/final-apk"

          cp "$APK" \
            "$GITHUB_WORKSPACE/final-apk/Elora-Dashboard.apk"

          echo "FINAL_APK=$GITHUB_WORKSPACE/final-apk/Elora-Dashboard.apk" \
            >> "$GITHUB_ENV"

      # --------------------------------------------------
      # 13) Verify APK
      # --------------------------------------------------
      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          test -s "$FINAL_APK"

          echo "APK size:"
          ls -lh "$FINAL_APK"

          echo
          echo "Testing APK archive..."

          unzip -t "$FINAL_APK" >/dev/null

          echo "APK archive is valid."

      # --------------------------------------------------
      # 14) Upload APK
      # --------------------------------------------------
      - name: Upload ELORA Dashboard APK
        uses: actions/upload-artifact@v5
        with:
          name: Elora-Dashboard-APK
          path: final-apk/Elora-Dashboard.apk
          if-no-files-found: error
          retention-days: 30

      # --------------------------------------------------
      # 15) Upload mapping if generated
      # --------------------------------------------------
      - name: Upload mapping
        uses: actions/upload-artifact@v5
        with:
          name: Elora-Dashboard-Mapping
          path: |
            ${{ env.PROJECT_ROOT }}/app/build/outputs/mapping/release/**
          if-no-files-found: ignore
          retention-days: 30

      # --------------------------------------------------
      # 16) Cleanup signing material
      # --------------------------------------------------
      - name: Cleanup signing files
        if: always()
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/elora-signing"
