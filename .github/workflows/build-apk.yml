name: Build Elora Dashboard APK v1.4.0

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Elora Dashboard APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
          cache-disabled: true

      - name: Prepare Project
        shell: bash
        run: |
          set -e

          echo "Searching for Android project..."

          if [ -f "settings.gradle" ] && [ -f "app/build.gradle" ]; then
            PROJECT_DIR="$PWD"
            echo "Project files are already in repository root."

          elif [ -f "settings.gradle.kts" ] && [ -f "app/build.gradle.kts" ]; then
            PROJECT_DIR="$PWD"
            echo "Kotlin Gradle project found in repository root."

          else
            ZIP_FILE=$(find . -type f -name "*.zip" ! -path "./.git/*" | head -n 1)

            if [ -z "$ZIP_FILE" ]; then
              echo "ERROR: No Android project and no ZIP file found."
              exit 1
            fi

            echo "Found ZIP:"
            echo "$ZIP_FILE"

            rm -rf android-source
            mkdir -p android-source

            unzip -q "$ZIP_FILE" -d android-source

            SETTINGS_FILE=$(find android-source -type f -name "settings.gradle" | head -n 1)

            if [ -z "$SETTINGS_FILE" ]; then
              SETTINGS_FILE=$(find android-source -type f -name "settings.gradle.kts" | head -n 1)
            fi

            if [ -z "$SETTINGS_FILE" ]; then
              echo "ERROR: settings.gradle was not found inside ZIP."
              echo "ZIP contents:"
              find android-source -maxdepth 4 -type f | head -n 100
              exit 1
            fi

            PROJECT_DIR=$(dirname "$SETTINGS_FILE")

            echo "Android project found at:"
            echo "$PROJECT_DIR"
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project structure:"
          ls -la "$PROJECT_DIR"
          ls -la "$PROJECT_DIR/app"

      - name: Verify Project
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "Verifying Elora Dashboard project..."

          test -f settings.gradle || test -f settings.gradle.kts
          test -f build.gradle || test -f build.gradle.kts

          if [ -f "app/build.gradle" ]; then
            APP_GRADLE="app/build.gradle"
          else
            APP_GRADLE="app/build.gradle.kts"
          fi

          test -f "$APP_GRADLE"
          test -f app/src/main/AndroidManifest.xml

          echo "Gradle file:"
          cat "$APP_GRADLE" | grep -E "versionCode|versionName" || true

          echo "Project verification completed."

      - name: Clean
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon clean

      - name: Build APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          gradle --no-daemon \
            --stacktrace \
            --warning-mode all \
            :app:assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          echo "Checking APK..."

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not created."
            exit 1
          fi

          echo "APK successfully created:"
          ls -lh "$APK"

          mkdir -p release

          cp "$APK" \
            "release/Elora-Dashboard-v1.4.0-debug.apk"

          echo "Final APK:"
          ls -lh "release/Elora-Dashboard-v1.4.0-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Elora-Dashboard-v1.4.0
          path: release/Elora-Dashboard-v1.4.0-debug.apk
          if-no-files-found: error
          retention-days: 30
