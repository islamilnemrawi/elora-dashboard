name: Build Elora Dashboard APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: elora-dashboard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Elora Dashboard APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
          cache-disabled: true

      - name: Find Dashboard ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 2 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Dashboard ZIP not found."
            exit 1
          fi

          echo "ZIP:"
          echo "$ZIP_FILE"

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Extract Dashboard
        shell: bash
        run: |
          set -e

          rm -rf android-project
          mkdir -p android-project

          unzip -q "$ZIP_FILE" -d android-project

          echo "Extracted files:"
          find android-project -maxdepth 5 -type f | sort | head -300

      - name: Locate Android Project
        shell: bash
        run: |
          set -e

          SETTINGS_FILE=$(find android-project \
            -type f \
            \( \
              -name "settings.gradle" \
              -o \
              -name "settings.gradle.kts" \
            \) \
            | head -n 1)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle not found."
            echo "Full extracted structure:"
            find android-project -maxdepth 8 -type f | sort
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo "Android project:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Check Project
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "Project directory:"
          pwd

          echo "Files:"
          ls -lah

          echo "Gradle files:"
          find . -maxdepth 3 -type f \
            \( \
              -name "settings.gradle" \
              -o \
              -name "settings.gradle.kts" \
              -o \
              -name "build.gradle" \
              -o \
              -name "build.gradle.kts" \
            \)

      - name: Clean
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle --no-daemon clean

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle \
            --no-daemon \
            --stacktrace \
            --warning-mode all \
            :app:assembleDebug

      - name: Verify APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"

          echo "APK created successfully:"
          ls -lh "$APK"

      - name: Prepare APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          mkdir -p release

          cp \
            app/build/outputs/apk/debug/app-debug.apk \
            release/Elora-Dashboard-v1.4.0-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Elora-Dashboard-v1.4.0
          path: ${{ env.PROJECT_DIR }}/release/Elora-Dashboard-v1.4.0-debug.apk
          if-no-files-found: error
          retention-days: 30
