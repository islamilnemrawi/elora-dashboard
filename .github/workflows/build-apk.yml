name: Build Elora Dashboard v1.9.13 PRO

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  build:
    name: Build Sign Verify Release Elora Dashboard v1.9.13 PRO
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find and extract Elora project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf android-project
          mkdir -p android-project

          if [[ -f settings.gradle && -f app/build.gradle ]]; then
            echo "PROJECT_DIR=." >> "$GITHUB_ENV"
            exit 0
          fi

          ZIP_FILE=$(find . -maxdepth 2 -type f \
            -name 'Elora_Dashboard*.zip' \
            -printf '%T@ %p\n' |
            sort -nr |
            head -n 1 |
            cut -d' ' -f2-)

          if [[ -z "$ZIP_FILE" ]]; then
            echo "ERROR: Elora Dashboard ZIP was not found."
            find . -maxdepth 3 -type f ! -path './.git/*' | sort
            exit 1
          fi

          echo "Using ZIP: $ZIP_FILE"
          unzip -q "$ZIP_FILE" -d android-project

          SETTINGS_FILE=$(find android-project \
            -type f \
            -name settings.gradle \
            -print |
            head -n 1)

          [[ -n "$SETTINGS_FILE" ]] || {
            echo "ERROR: settings.gradle not found."
            exit 1
          }

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          [[ -f "$PROJECT_DIR/app/build.gradle" ]] || {
            echo "ERROR: app/build.gradle not found."
            exit 1
          }

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-disabled: true

      - name: Prepare release keystore
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ELORA_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          [[ -n "$KEYSTORE_B64" ]] || {
            echo "Missing ELORA_KEYSTORE_BASE64 secret."
            exit 1
          }

          printf '%s' "$KEYSTORE_B64" |
            base64 --decode >
            "$RUNNER_TEMP/elora-release.keystore"

          test -s "$RUNNER_TEMP/elora-release.keystore"

          echo \
            "ELORA_KEYSTORE_FILE=$RUNNER_TEMP/elora-release.keystore" \
            >> "$GITHUB_ENV"

      - name: Verify version
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          grep -q "versionCode 19" app/build.gradle
          grep -q "versionName '1.9.13'" app/build.gradle
          grep -q "applicationId 'com.elora.dashboard'" app/build.gradle

          echo "Version 1.9.13 / code 19 verified."

      - name: Build Release APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          gradle \
            --no-daemon \
            --stacktrace \
            clean \
            assembleRelease

      - name: Locate unsigned APK
        shell: bash
        run: |
          set -euo pipefail

          UNSIGNED_APK=$(find "$PROJECT_DIR" \
            -type f \
            -name '*-unsigned.apk' |
            head -n 1)

          [[ -n "$UNSIGNED_APK" ]] || {
            echo "ERROR: unsigned APK not found."
            exit 1
          }

          echo "ELORA_UNSIGNED_APK=$UNSIGNED_APK" >> "$GITHUB_ENV"

      - name: Sign Release APK
        shell: bash
        env:
          ELORA_KEYSTORE_PASSWORD: ${{ secrets.ELORA_KEYSTORE_PASSWORD }}
          ELORA_KEY_ALIAS: ${{ secrets.ELORA_KEY_ALIAS }}
          ELORA_KEY_PASSWORD: ${{ secrets.ELORA_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          [[ -n "$ELORA_KEYSTORE_PASSWORD" ]] || {
            echo "Missing ELORA_KEYSTORE_PASSWORD secret."
            exit 1
          }

          [[ -n "$ELORA_KEY_ALIAS" ]] || {
            echo "Missing ELORA_KEY_ALIAS secret."
            exit 1
          }

          [[ -n "$ELORA_KEY_PASSWORD" ]] || {
            echo "Missing ELORA_KEY_PASSWORD secret."
            exit 1
          }

          SIGNED_APK="$RUNNER_TEMP/Elora-Dashboard-v1.9.13.apk"

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks "$ELORA_KEYSTORE_FILE" \
            --ks-key-alias "$ELORA_KEY_ALIAS" \
            --ks-pass "pass:$ELORA_KEYSTORE_PASSWORD" \
            --key-pass "pass:$ELORA_KEY_PASSWORD" \
            --out "$SIGNED_APK" \
            "$ELORA_UNSIGNED_APK"

          test -s "$SIGNED_APK"

          echo \
            "ELORA_SIGNED_APK=$SIGNED_APK" \
            >> "$GITHUB_ENV"

      - name: Verify APK signature and version
        shell: bash
        run: |
          set -euo pipefail

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            verify \
            --verbose \
            "$ELORA_SIGNED_APK"

          "$ANDROID_HOME/build-tools/35.0.0/aapt" \
            dump badging \
            "$ELORA_SIGNED_APK" |
            grep -E \
            "package:|versionCode='19'|versionName='1.9.13'"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Elora-Dashboard-v1.9.13-PRO
          path: ${{ env.ELORA_SIGNED_APK }}
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.9.13
          name: Elora Dashboard v1.9.13 PRO
          generate_release_notes: true
          files: ${{ env.ELORA_SIGNED_APK }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
