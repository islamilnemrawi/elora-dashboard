name: Build Elora Dashboard APK

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: elora-dashboard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Elora Dashboard APK
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. تحميل المشروع
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================
      # 2. إعداد Java 17
      # ==========================================
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      # ==========================================
      # 3. إعداد Android SDK
      # ==========================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3


      # ==========================================
      # 4. تثبيت Android SDK 35
      # ==========================================
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"


      # ==========================================
      # 5. إعداد Gradle 8.7
      # ==========================================
      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
          cache-disabled: true


      # ==========================================
      # 6. فك ZIP الخاص بالداشبورد
      # ==========================================
      - name: Extract Elora Dashboard
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 2 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found."
            exit 1
          fi

          echo "ZIP found:"
          echo "$ZIP_FILE"

          mkdir -p android-project

          unzip -q "$ZIP_FILE" -d android-project

          echo ""
          echo "Extracted project:"
          find android-project -maxdepth 4 -type f | sort | head -300


      # ==========================================
      # 7. البحث عن مشروع Android
      # ==========================================
      - name: Locate Android project
        shell: bash
        run: |
          set -e

          echo "Searching for settings.gradle..."

          SETTINGS_FILE=$(find android-project \
            -type f \
            \( \
              -name "settings.gradle" \
              -o \
              -name "settings.gradle.kts" \
            \) \
            | head -n 1)

          if [ -z "$SETTINGS_FILE" ]; then
            echo ""
            echo "ERROR: Android Gradle project was not found."
            echo ""
            echo "Extracted files:"
            find android-project -maxdepth 6 -type f | sort
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo ""
          echo "=========================================="
          echo "Android project found"
          echo "=========================================="
          echo "Settings:"
          echo "$SETTINGS_FILE"
          echo ""
          echo "Project directory:"
          echo "$PROJECT_DIR"
          echo "=========================================="

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"


      # ==========================================
      # 8. عرض ملفات المشروع
      # ==========================================
      - name: Verify project structure
        shell: bash
        run: |
          set -e

          echo "Project:"
          ls -lah "$PROJECT_DIR"

          echo ""
          echo "Gradle files:"
          find "$PROJECT_DIR" \
            -maxdepth 3 \
            -type f \
            \( \
              -name "settings.gradle" \
              -o \
              -name "settings.gradle.kts" \
              -o \
              -name "build.gradle" \
              -o \
              -name "build.gradle.kts" \
            \) \
            -print


      # ==========================================
      # 9. تنظيف المشروع
      # ==========================================
      - name: Clean project
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle \
            --no-daemon \
            clean


      # ==========================================
      # 10. بناء APK
      # ==========================================
      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle \
            --no-daemon \
            --stacktrace \
            --warning-mode all \
            :app:assembleDebug


      # ==========================================
      # 11. التأكد من إنشاء APK
      # ==========================================
      - name: Verify APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not created."
            exit 1
          fi

          echo ""
          echo "=========================================="
          echo "APK BUILD SUCCESSFUL"
          echo "=========================================="

          ls -lh "$APK"

          echo "=========================================="


      # ==========================================
      # 12. تجهيز الملف باسم احترافي
      # ==========================================
      - name: Prepare APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          mkdir -p release

          cp \
            app/build/outputs/apk/debug/app-debug.apk \
            release/Elora-Dashboard-v1.3.0-debug.apk

          echo ""
          echo "Release file:"
          ls -lh release/


      # ==========================================
      # 13. رفع APK إلى GitHub
      # ==========================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Elora-Dashboard-v1.3.0-Debug
          path: ${{ env.PROJECT_DIR }}/release/Elora-Dashboard-v1.3.0-debug.apk
          if-no-files-found: error
          retention-days: 30
