name: Build Elora Dashboard APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Elora Dashboard
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find project ZIP
        id: zip
        run: |
          ZIP_FILE=$(find . -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "No ZIP file found. Trying existing project files..."
            echo "project_dir=." >> "$GITHUB_OUTPUT"
          else
            echo "Found ZIP: $ZIP_FILE"
            rm -rf build-project
            mkdir -p build-project
            unzip -q "$ZIP_FILE" -d build-project

            PROJECT_DIR=$(find build-project -type f -name "settings.gradle" -o -name "settings.gradle.kts" -print -quit | xargs -r dirname)

            if [ -z "$PROJECT_DIR" ]; then
              echo "ERROR: settings.gradle was not found inside ZIP."
              exit 1
            fi

            echo "Project directory: $PROJECT_DIR"
            echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Accept Android licenses
        run: |
          yes |
