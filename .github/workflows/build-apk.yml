name: Build Elora Dashboard APK v1.4.0

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: elora-dashboard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Elora Dashboard
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
          cache-disabled: true

      # Find the Dashboard ZIP
      - name: Find Dashboard ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -type f -name "*.zip" ! -path "./.git/*" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "::error::Dashboard ZIP not found."
            exit 1
          fi

          echo "Dashboard ZIP found:"
          echo "$ZIP_FILE"

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      # Extract ZIP
      - name: Extract Dashboard
        shell: bash
        run: |
          set -e

          rm -rf android-project
          mkdir -p android-project

          unzip -q "$ZIP_FILE" -d android-project

          echo "Dashboard extracted successfully."

      # Locate Android project
      - name: Locate Android Project
        shell: bash
        run: |
          set -e

          SETTINGS_FILE=$(find android-project -type f -name "settings.gradle" | head -n 1)

          if [ -z "$SETTINGS_FILE" ]; then
            SETTINGS_FILE=$(find android-project -type f -name "settings.gradle.kts" | head -n 1)
          fi

          if [ -z "$SETTINGS_FILE" ]; then
            echo "::error::settings.gradle was not found."
            echo ""
            echo "Extracted files:"
            find android-project -maxdepth 8 -type f | sort
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo "Android project:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # Verify important files
      - name: Verify Elora Project
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          test -d app

          test -f app/build.gradle || test -f app/build.gradle.kts

          test -f app/src/main/assets/Elora_Dashboard.html

          echo "================================"
          echo "Elora project verified"
          echo "================================"

          echo ""
          echo "Project files:"
          find . -maxdepth 4 -type f | sort | head -300

      # Verify version BEFORE build
      - name: Verify Version
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          if [ ! -f app/build.gradle ]; then
            echo "::error::app/build.gradle not found."
            exit 1
          fi

          echo "Android version configuration:"
          grep -n "versionCode" app/build.gradle || true
          grep -n "versionName" app/build.gradle || true

          VERSION_NAME=$(grep "versionName" app/build.gradle | head -n 1 | sed -E "s/.*versionName[[:space:]]+['\"]([^'\"]+)['\"].*/\1/")
          VERSION_CODE=$(grep "versionCode" app/build.gradle | head -n 1 | sed -E "s/.*versionCode[[:space:]]+([0-9]+).*/\1/")

          echo ""
          echo "Detected versionName: $VERSION_NAME"
          echo "Detected versionCode: $VERSION_CODE"

          if [ "$VERSION_NAME" != "1.4.0" ]; then
            echo "::error::Expected versionName 1.4.0 but found $VERSION_NAME"
            exit 1
          fi

          if [ "$VERSION_CODE" -lt 5 ]; then
            echo "::error::versionCode must be 5 or higher."
            exit 1
          fi

          echo ""
          echo "Version check PASSED."

      # Clean
      - name: Clean
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle --no-daemon
