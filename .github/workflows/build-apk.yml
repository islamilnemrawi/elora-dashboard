name: Build Elora Dashboard APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Elora Dashboard
        shell: bash
        run: |
          set -e

          echo "Repository files:"
          ls -lah

          ZIP_FILE="Elora_Dashboard_FINAL_PREMIUM.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: $ZIP_FILE not found."
            exit 1
          fi

          echo "Extracting $ZIP_FILE..."

          unzip -o "$ZIP_FILE" -d .

          echo "Checking Android project..."

          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml

          echo "Android project found successfully."

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
          cache-disabled: true

      - name: Show project structure
        run: |
          echo "Project structure:"
          find . -maxdepth 4 -type f | sort

      - name: Build APK
        run: |
          set -e

          echo "Building Elora Dashboard APK..."

          gradle \
            --no-daemon \
            --no-build-cache \
            --stacktrace \
            :app:assembleDebug

      - name: Verify APK
        run: |
          set -e

          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "======================================"
          echo "APK BUILD SUCCESSFUL"
          echo "======================================"

          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Elora-Dashboard-Professional
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
