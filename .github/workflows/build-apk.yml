name: Build Elora Dashboard APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Prepare project
        shell: bash
        run: |
          set -e

          echo "Checking project..."

          if [ -f "settings.gradle" ] || [ -f "settings.gradle.kts" ]; then
            echo "Android project found in repository root."
          else
            ZIP_FILE=$(find . -maxdepth 2 -type f -name "*.zip" | head -n 1)

            if [ -n "$ZIP_FILE" ]; then
              echo "Found ZIP: $ZIP_FILE"
              mkdir -p extracted
              unzip -q "$ZIP_FILE" -d extracted

              PROJECT_DIR=$(find extracted -maxdepth 4 -type f \
                \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
                -print -quit | xargs -r dirname)

              if [ -n "$PROJECT_DIR" ]; then
                echo "Project directory: $PROJECT_DIR"
                cp -R "$PROJECT_DIR"/. .
              else
                echo "ERROR: Android project not found inside ZIP."
                exit 1
              fi
            else
              echo "ERROR: No Android project or ZIP found."
              exit 1
            fi
          fi

          echo "Project files:"
          ls -la

      - name: Make Gradle executable
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          fi

      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          if [ -f "./gradlew" ]; then
            ./gradlew clean assembleDebug --stacktrace
          else
            gradle clean assembleDebug --stacktrace
          fi

      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK=$(find . -type f -path "*/build/outputs/apk/*.apk" -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK generated successfully:"
          echo "$APK"

          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Elora-Dashboard-APK
          path: |
            **/build/outputs/apk/**/*.apk
            **/build/outputs/apk/*.apk
          if-no-files-found: error
