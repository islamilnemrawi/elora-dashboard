name: Build Elora Dashboard APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Elora Dashboard
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract project
        id: project
        shell: bash
        run: |
          ZIP_FILE=$(find . -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "No ZIP found. Using repository directly."
            echo "project_dir=." >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Found ZIP: $ZIP_FILE"

          rm -rf build-project
          mkdir -p build-project

          unzip -q "$ZIP_FILE" -d build-project

          echo "Extracted files:"
          find build-project -maxdepth 4 -type f | head -100

          PROJECT_DIR=$(find build-project -type f -name "settings.gradle" -print -quit)

          if [ -z "$PROJECT_DIR" ]; then
            PROJECT_DIR=$(find build-project -type f -name "settings.gradle.kts" -print -quit)
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Gradle settings file was not found."
            echo "Searching for Gradle files..."
            find build-project -type f -name "build.gradle" -print
            find build-project -type f -name "build.gradle.kts" -print
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_DIR")

          echo "Project directory: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android
        uses: android-actions/setup-android@v3

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Build APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          echo "Building project..."
          gradle clean assembleDebug --stacktrace

      - name: Find APK
        id: apk
        shell: bash
        run: |
          APK=$(find "${{ steps.project.outputs.project_dir }}" -type f -name "*.apk" -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK found:"
          echo "$APK"

          echo "apk_path=$APK" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Elora-Dashboard-APK
          path: ${{ steps.apk.outputs.apk_path }}
          if-no-files-found: error
