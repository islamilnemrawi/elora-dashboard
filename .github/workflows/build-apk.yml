name: Build Elora Dashboard APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: elora-dashboard-build
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build Elora Dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # 1) Download project
      - name: Checkout source
        uses: actions/checkout@v4

      # 2) Java 17 required by Android Gradle Plugin 8.6.1
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # 3) Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 4) Install required Android components
      - name: Install Android SDK
        shell: bash
        run: |
          yes | sdkmanager --licenses > /dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # 5) Install exactly Gradle 8.7
      #    No Gradle cache is used, so a wrapper is NOT required here.
      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
          cache-disabled: true

      # 6) Verify environment
      - name: Verify build environment
        shell: bash
        run: |
          echo "===== Java ====="
          java -version

          echo "===== Gradle ====="
          gradle --version

          echo "===== Project ====="
          pwd
          ls -la

          echo "===== Android SDK ====="
          ls "$ANDROID_HOME/platforms/android-35"
          ls "$ANDROID_HOME/build-tools/35.0.0"

      # 7) Build APK
      - name: Build Debug APK
        shell: bash
        run: |
          gradle :app:assembleDebug --no-daemon --stacktrace

      # 8) Check generated APK
      - name: Verify APK
        shell: bash
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk

          mkdir -p artifacts

          cp \
            app/build/outputs/apk/debug/app-debug.apk \
            artifacts/Elora-Dashboard.apk

          ls -lh artifacts/Elora-Dashboard.apk

      # 9) Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Elora-Dashboard-APK
          path: artifacts/Elora-Dashboard.apk
          if-no-files-found: error
          retention-days: 30
