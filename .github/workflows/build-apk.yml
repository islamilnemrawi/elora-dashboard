name: Build Elora Dashboard APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find ZIP
        id: zip
        shell: bash
        run: |
          set -e

          ZIP_FILE="$(find . -type f -iname '*.zip' -print -quit)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found."
            exit 1
          fi

          echo "ZIP: $ZIP_FILE"
          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      - name: Extract ZIP
        shell: bash
        run: |
          set -e

          mkdir -p "$RUNNER_TEMP/elora"

          unzip -q \
            "${{ steps.zip.outputs.zip_file }}" \
            -d "$RUNNER_TEMP/elora"

          echo "ZIP extracted successfully."

      - name: Find Android project
        id: project
        shell: bash
        run: |
          set -e

          PROJECT_DIR="$(find "$RUNNER_TEMP/elora" \
            -type f \
            -name 'settings.gradle' \
            -print -quit)"

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: settings.gradle not found."
            echo "Extracted files:"
            find "$RUNNER_TEMP/elora" -maxdepth 5 -type f | head -200
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PROJECT_DIR")"

          echo "Android project:"
          echo "$PROJECT_DIR"

          test -f "$PROJECT_DIR/settings.gradle"
          test -f "$PROJECT_DIR/build.gradle"
          test -f "$PROJECT_DIR/app/build.gradle"
          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Verify Elora Dashboard
        shell: bash
        run: |
          set -e

          PROJECT_DIR="${{ steps.project.outputs.project_dir }}"

          test -f "$PROJECT_DIR/app/src/main/assets/Elora_Dashboard.html"
          test -f "$PROJECT_DIR/app/src/main/assets/index.html"
          test -f "$PROJECT_DIR/app/src/main/assets/supabase-config.js"

          echo "Dashboard files OK."

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
          cache-disabled: true

      - name: Build APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -e

          echo "Building Elora Dashboard..."

          gradle --no-daemon :app:assembleDebug --stacktrace

          echo "BUILD SUCCESSFUL"

      - name: Copy APK
        shell: bash
        run: |
          set -e

          PROJECT_DIR="${{ steps.project.outputs.project_dir }}"

          cp \
            "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" \
            "$GITHUB_WORKSPACE/Elora-Dashboard-Premium.apk"

          ls -lh "$GITHUB_WORKSPACE/Elora-Dashboard-Premium.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Elora-Dashboard-Premium
          path: Elora-Dashboard-Premium.apk
          if-no-files-found: error
