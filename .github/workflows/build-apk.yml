name: Build Elora Dashboard APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Signed Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:

      # 1) تحميل المشروع
      - name: Checkout
        uses: actions/checkout@v6

      # 2) تجهيز Java 17
      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # 3) تجهيز Android SDK
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      # 4) تثبيت أدوات Android المطلوبة
      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # 5) تجهيز Gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      # 6) البحث عن مشروع Android
      - name: Detect Android Project
        shell: bash
        run: |
          set -euo pipefail

          SETTINGS_FILE=""

          SETTINGS_FILE=$(find . -maxdepth 6 -type f -name "settings.gradle" | head -n 1 || true)

          if [ -z "$SETTINGS_FILE" ]; then
            SETTINGS_FILE=$(find . -maxdepth 6 -type f -name "settings.gradle.kts" | head -n 1 || true)
          fi

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: Android settings.gradle was not found."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo "Android project:"
          echo "$PROJECT_DIR"

          if [ ! -f "$PROJECT_DIR/app/build.gradle" ] &&
             [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "ERROR: app/build.gradle was not found."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # 7) تجهيز ملف التوقيع
      - name: Prepare Release Keystore
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ELORA_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          if [ -z "$KEYSTORE_B64" ]; then
            echo "ERROR: ELORA_KEYSTORE_BASE64 secret is missing."
            exit 1
          fi

          printf '%s' "$KEYSTORE_B64" \
            | base64 --decode \
            > "$RUNNER_TEMP/elora-release.keystore"

          if [ ! -s "$RUNNER_TEMP/elora-release.keystore" ]; then
            echo "ERROR: Keystore was not created."
            exit 1
          fi

          echo "ELORA_KEYSTORE_FILE=$RUNNER_TEMP/elora-release.keystore" \
            >> "$GITHUB_ENV"

      # 8) بناء Release APK
      - name: Build Release APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "Cleaning project..."
          gradle --no-daemon clean

          echo "Building Release APK..."
          gradle \
            --no-daemon \
            --stacktrace \
            --warning-mode all \
            assembleRelease

          echo "APK files generated:"
          find . -type f -name "*.apk" -print

      # 9) التأكد من وجود APK غير موقع
      - name: Locate Release APK
        shell: bash
        run: |
          set -euo pipefail

          APK=$(find "$PROJECT_DIR" \
            -type f \
            -name "*-unsigned.apk" \
            | head -n 1 || true)

          if [ -z "$APK" ]; then
            echo "ERROR: Unsigned Release APK was not found."

            echo "All APK files:"
            find "$PROJECT_DIR" \
              -type f \
              -name "*.apk" \
              -print || true

            exit 1
          fi

          echo "Unsigned APK:"
          echo "$APK"

          echo "ELORA_UNSIGNED_APK=$APK" >> "$GITHUB_ENV"

      # 10) توقيع APK
      - name: Sign Release APK
        shell: bash
        env:
          ELORA_KEYSTORE_PASSWORD: ${{ secrets.ELORA_KEYSTORE_PASSWORD }}
          ELORA_KEY_ALIAS: ${{ secrets.ELORA_KEY_ALIAS }}
          ELORA_KEY_PASSWORD: ${{ secrets.ELORA_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "$ELORA_KEYSTORE_PASSWORD" ]; then
            echo "ERROR: ELORA_KEYSTORE_PASSWORD is missing."
            exit 1
          fi

          if [ -z "$ELORA_KEY_ALIAS" ]; then
            echo "ERROR: ELORA_KEY_ALIAS is missing."
            exit 1
          fi

          if [ -z "$ELORA_KEY_PASSWORD" ]; then
            echo "ERROR: ELORA_KEY_PASSWORD is missing."
            exit 1
          fi

          SIGNED_APK="$RUNNER_TEMP/Elora-Dashboard-PRO.apk"

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks "$ELORA_KEYSTORE_FILE" \
            --ks-key-alias "$ELORA_KEY_ALIAS" \
            --ks-pass "pass:$ELORA_KEYSTORE_PASSWORD" \
            --key-pass "pass:$ELORA_KEY_PASSWORD" \
            --out "$SIGNED_APK" \
            "$ELORA_UNSIGNED_APK"

          if [ ! -s "$SIGNED_APK" ]; then
            echo "ERROR: Signed APK was not created."
            exit 1
          fi

          echo "ELORA_SIGNED_APK=$SIGNED_APK" >> "$GITHUB_ENV"

          ls -lh "$SIGNED_APK"

      # 11) التحقق من التوقيع
      - name: Verify APK Signature
        shell: bash
        run: |
          set -euo pipefail

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            verify \
            --verbose \
            "$ELORA_SIGNED_APK"

          echo "APK signature verified successfully."

      # 12) عرض بيانات APK
      - name: Inspect APK
        shell: bash
        run: |
          set -euo pipefail

          echo "Final APK:"
          echo "$ELORA_SIGNED_APK"

          ls -lh "$ELORA_SIGNED_APK"

          echo "APK package information:"

          "$ANDROID_HOME/build-tools/35.0.0/aapt" \
            dump badging \
            "$ELORA_SIGNED_APK" \
            | grep -E \
              "package:|versionCode=|versionName=" \
            | head -n 5 || true

      # 13) رفع APK النهائي
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v5
        with:
          name: Elora-Dashboard-PRO-APK
          path: ${{ env.ELORA_SIGNED_APK }}
          if-no-files-found: error
          retention-days: 30
