name: Build Elora Dashboard PRO

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Signed Elora Dashboard PRO
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:

      # ==========================================
      # 1. Checkout
      # ==========================================
      - name: Checkout
        uses: actions/checkout@v6


      # ==========================================
      # 2. Find and extract PRO project
      # ==========================================
      - name: Find and extract Elora Dashboard PRO
        shell: bash
        run: |
          set -euo pipefail

          echo "Searching for Elora Dashboard PRO ZIP..."

          ZIP_FILE="$(find . -maxdepth 5 -type f \
            -iname 'Elora_Dashboard*.zip' \
            | head -n 1)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Elora Dashboard PRO ZIP was not found."
            echo "Files in repository:"
            find . -maxdepth 5 -type f -print
            exit 1
          fi

          echo "Using project:"
          echo "$ZIP_FILE"

          rm -rf android-project
          mkdir -p android-project

          unzip -q "$ZIP_FILE" -d android-project

          echo "Searching for Android project..."

          SETTINGS_FILE="$(
            find android-project -type f \
              \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) \
              | head -n 1
          )"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle was not found."

            echo "Extracted files:"
            find android-project -maxdepth 6 -type f -print

            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"

          echo "PROJECT_DIR=$PROJECT_DIR"

          if [ ! -f "$PROJECT_DIR/app/build.gradle" ] && \
             [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then

            echo "ERROR: Android app module was not found."

            find "$PROJECT_DIR" -maxdepth 5 -type f -print

            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml" ]; then
            echo "ERROR: AndroidManifest.xml was not found."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"


      # ==========================================
      # 3. Java 17
      # ==========================================
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle


      # ==========================================
      # 4. Android SDK
      # ==========================================
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4


      # ==========================================
      # 5. Android SDK packages
      # ==========================================
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"


      # ==========================================
      # 6. Gradle
      # ==========================================
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'


      # ==========================================
      # 7. Release keystore
      # ==========================================
      - name: Prepare release keystore
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ELORA_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          if [ -z "$KEYSTORE_B64" ]; then
            echo "ERROR: ELORA_KEYSTORE_BASE64 secret is missing."
            exit 1
          fi

          echo "$KEYSTORE_B64" | base64 --decode \
            > "$RUNNER_TEMP/elora-release.keystore"

          if [ ! -s "$RUNNER_TEMP/elora-release.keystore" ]; then
            echo "ERROR: Keystore file is empty."
            exit 1
          fi

          echo "ELORA_KEYSTORE_FILE=$RUNNER_TEMP/elora-release.keystore" \
            >> "$GITHUB_ENV"

          echo "Release keystore prepared successfully."


      # ==========================================
      # 8. Build Release APK
      # ==========================================
      - name: Build signed Release APK
        shell: bash
        env:
          ELORA_KEYSTORE_PASSWORD: ${{ secrets.ELORA_KEYSTORE_PASSWORD }}
          ELORA_KEY_ALIAS: ${{ secrets.ELORA_KEY_ALIAS }}
          ELORA_KEY_PASSWORD: ${{ secrets.ELORA_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "Starting Gradle build..."

          gradle \
            --no-daemon \
            --stacktrace \
            clean \
            assembleRelease

          echo "Gradle build finished."

          echo "Searching for generated APK files..."

          find . \
            -type f \
            -name '*.apk' \
            -print || true


      # ==========================================
      # 9. Find APK and verify signature
      # ==========================================
      - name: Find and verify APK
        shell: bash
        run: |
          set -euo pipefail

          echo "Searching for Release APK..."

          APK="$(
            find "$PROJECT_DIR" \
              -type f \
              -name '*.apk' \
              -path '*/build/outputs/apk/*' \
              | head -n 1
          )"

          if [ -z "$APK" ]; then
            echo "ERROR: No APK was produced."

            echo ""
            echo "APK files in entire workspace:"
            find . -type f -name '*.apk' -print || true

            echo ""
            echo "Build output directories:"
            find "$PROJECT_DIR" \
              -type d \
              -path '*/build/outputs/*' \
              -print || true

            echo ""
            echo "Last build files:"
            find "$PROJECT_DIR" \
              -type f \
              -path '*/build/*' \
              -print \
              | tail -n 100 || true

            exit 1
          fi

          echo "APK found:"
          echo "$APK"

          echo ""
          echo "APK size:"
          ls -lh "$APK"

          echo ""
          echo "Verifying APK signature..."

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            verify \
            --verbose \
            "$APK"

          echo ""
          echo "APK signature verified successfully."

          echo "ELORA_APK=$APK" >> "$GITHUB_ENV"


      # ==========================================
      # 10. Display APK information
      # ==========================================
      - name: APK information
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "ELORA DASHBOARD PRO APK"
          echo "=========================================="

          echo "APK:"
          echo "$ELORA_APK"

          echo ""
          echo "Size:"
          ls -lh "$ELORA_APK"

          echo ""
          echo "Package information:"

          "$ANDROID_HOME/build-tools/35.0.0/aapt" \
            dump badging "$ELORA_APK" \
            | grep -E \
              "package:|versionCode=|versionName=" \
            | head -n 5 || true


      # ==========================================
      # 11. Upload APK
      # ==========================================
      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: Elora-Dashboard-PRO
          path: ${{ env.ELORA_APK }}
          if-no-files-found: error
          retention-days: 30

      # ==========================================
      # 12. Finished
      # ==========================================
      - name: Build completed
        shell: bash
        run: |
          echo ""
          echo "=========================================="
          echo "ELORA DASHBOARD PRO BUILD SUCCESS"
          echo "=========================================="
          echo ""
          echo "Signed APK:"
          echo "$ELORA_APK"
          echo ""
          echo "The APK was built, signed, verified and uploaded."
