name: Build Elora Dashboard APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find project ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE=""

          for f in *.zip; do
            [ -f "$f" ] || continue

            if unzip -Z1 "$f" | grep -qx "settings.gradle"; then
              ZIP_FILE="$f"
              break
            fi
          done

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Project ZIP not found"
            exit 1
          fi

          echo "Using project ZIP: $ZIP_FILE"
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Extract project
        shell: bash
        run: |
          set -e

          rm -rf "$RUNNER_TEMP/elora_project"
          mkdir -p "$RUNNER_TEMP/elora_project"

          unzip -q "$ZIP_FILE" -d "$RUNNER_TEMP/elora_project"

          cd "$RUNNER_TEMP/elora_project"

          if [ ! -f settings.gradle ] && [ -f */settings.gradle ]; then
            PROJECT_DIR="$(dirname "$(find . -name settings.gradle -print -quit)")"
            cd "$PROJECT_DIR"
          fi

          echo "PROJECT_DIR=$PWD" >> "$GITHUB_ENV"

          echo "Project directory:"
          pwd

          echo "Project files:"
          ls -la

      - name: Verify Android project
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml

          echo "Android project verified."

      - name: Verify application ID and version
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "Checking applicationId..."

          grep -n "applicationId" app/build.gradle || true
          grep -n "versionCode" app/build.gradle || true
          grep -n "versionName" app/build.gradle || true

          grep -q 'applicationId[[:space:]]*=[[:space:]]*"com.elora.dashboard"' app/build.gradle
          grep -q 'versionCode[[:space:]]*=[[:space:]]*19' app/build.gradle
          grep -q 'versionName[[:space:]]*=[[:space:]]*"1.9.13"' app/build.gradle

          echo "Application/version verified."

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare and validate release keystore
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ELORA_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ELORA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ELORA_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ELORA_KEY_PASSWORD }}
        run: |
          set -e

          if [ -z "$KEYSTORE_B64" ]; then
            echo "ERROR: ELORA_KEYSTORE_BASE64 is missing."
            exit 1
          fi

          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "ERROR: ELORA_KEYSTORE_PASSWORD is missing."
            exit 1
          fi

          if [ -z "$KEY_ALIAS" ]; then
            echo "ERROR: ELORA_KEY_ALIAS is missing."
            exit 1
          fi

          KEYSTORE_FILE="$RUNNER_TEMP/elora-release.keystore"

          # Remove whitespace from the BASE64 text only.
          # Never modify the decoded binary keystore.
          CLEAN_B64=$(printf '%s' "$KEYSTORE_B64" | tr -d '[:space:]')

          printf '%s' "$CLEAN_B64" | base64 --decode > "$KEYSTORE_FILE"

          if [ ! -s "$KEYSTORE_FILE" ]; then
            echo "ERROR: Decoded keystore is empty."
            exit 1
          fi

          echo "Keystore bytes: $(wc -c < "$KEYSTORE_FILE")"

          KEYSTORE_TYPE=""

          if keytool \
            -list \
            -keystore "$KEYSTORE_FILE" \
            -storepass "$KEYSTORE_PASSWORD" \
            -storetype PKCS12 \
            >/dev/null 2>&1; then

            KEYSTORE_TYPE="PKCS12"

          elif keytool \
            -list \
            -keystore "$KEYSTORE_FILE" \
            -storepass "$KEYSTORE_PASSWORD" \
            -storetype JKS \
            >/dev/null 2>&1; then

            KEYSTORE_TYPE="JKS"

          else
            echo "ERROR: Unable to open keystore."
            echo "The Base64, keystore password, or keystore itself may be invalid."
            exit 1
          fi

          echo "Detected keystore type: $KEYSTORE_TYPE"

          keytool \
            -list \
            -keystore "$KEYSTORE_FILE" \
            -storepass "$KEYSTORE_PASSWORD" \
            -storetype "$KEYSTORE_TYPE" \
            -alias "$KEY_ALIAS" \
            >/dev/null

          echo "Alias verified: $KEY_ALIAS"

          echo "KEYSTORE_FILE=$KEYSTORE_FILE" >> "$GITHUB_ENV"
          echo "ELORA_KEYSTORE_TYPE=$KEYSTORE_TYPE" >> "$GITHUB_ENV"

      - name: Verify signing certificate
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ELORA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ELORA_KEY_ALIAS }}
        run: |
          set -e

          keytool \
            -list \
            -v \
            -keystore "$KEYSTORE_FILE" \
            -storepass "$KEYSTORE_PASSWORD" \
            -storetype "$ELORA_KEYSTORE_TYPE" \
            -alias "$KEY_ALIAS" \
            | grep -E "Owner:|SHA256:"

      - name: Build release APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          chmod +x gradlew

          ./gradlew clean assembleRelease --no-daemon

      - name: Locate unsigned APK
        shell: bash
        run: |
          set -e

          APK="$(find "$PROJECT_DIR/app/build/outputs/apk/release" \
            -type f \
            -name "*unsigned*.apk" \
            | head -n 1)"

          if [ -z "$APK" ]; then
            echo "ERROR: Unsigned APK not found."
            find "$PROJECT_DIR/app/build/outputs" -type f || true
            exit 1
          fi

          echo "Unsigned APK: $APK"
          echo "UNSIGNED_APK=$APK" >> "$GITHUB_ENV"

      - name: Sign APK
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ELORA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ELORA_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ELORA_KEY_PASSWORD }}
        run: |
          set -e

          SIGNED_APK="$RUNNER_TEMP/elora-dashboard-1.9.13.apk"

          apksigner sign \
            --ks "$KEYSTORE_FILE" \
            --ks-type "$ELORA_KEYSTORE_TYPE" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out "$SIGNED_APK" \
            "$UNSIGNED_APK"

          echo "SIGNED_APK=$SIGNED_APK" >> "$GITHUB_ENV"

      - name: Verify APK signature
        shell: bash
        run: |
          set -e

          apksigner verify \
            --verbose \
            "$SIGNED_APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Elora-Dashboard-1.9.13
          path: ${{ env.SIGNED_APK }}

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.SIGNED_APK }}
          generate_release_notes: true
