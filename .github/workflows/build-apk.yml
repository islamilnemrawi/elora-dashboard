name: Build Elora Dashboard APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

env:
  JAVA_VERSION: '17'
  GRADLE_VERSION: '8.7'
  ANDROID_PLATFORM: '35'
  BUILD_TOOLS: '35.0.0'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" \
            "platforms;android-${ANDROID_PLATFORM}" \
            "build-tools;${BUILD_TOOLS}"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          cache-disabled: true

      - name: Prepare Elora source
        shell: bash
        run: |
          set -euo pipefail

          if [[ -f settings.gradle && -f app/build.gradle ]]; then
            echo "PROJECT_DIR=." >> "$GITHUB_ENV"
            echo "Using Android project from repository root."
            exit 0
          fi

          ZIP_FILE=""

          for f in *.zip; do
            [[ -f "$f" ]] || continue

            if unzip -l "$f" 2>/dev/null | \
              grep -qE '(^|/)settings\.gradle$' && \
              unzip -l "$f" 2>/dev/null | \
              grep -qE '(^|/)app/build\.gradle$'; then

              ZIP_FILE="$f"
              break
            fi
          done

          if [[ -z "$ZIP_FILE" ]]; then
            echo "ERROR: No Elora Android project found."
            find . -maxdepth 4 -type f | sort
            exit 1
          fi

          echo "Found project archive: $ZIP_FILE"

          rm -rf _elora_source
          mkdir -p _elora_source

          unzip -q "$ZIP_FILE" -d _elora_source

          PROJECT_DIR=""

          while IFS= read -r f; do
            d="$(dirname "$f")"

            if [[ -f "$d/settings.gradle" && \
                  -f "$d/app/build.gradle" ]]; then

              PROJECT_DIR="$d"
              break
            fi

          done < <(
            find _elora_source \
              -type f \
              -name settings.gradle \
              -print
          )

          if [[ -z "$PROJECT_DIR" ]]; then
            echo "ERROR: Android project could not be located."
            find _elora_source -maxdepth 5 -type f | sort
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Using project directory:"
          echo "$PROJECT_DIR"

      - name: Verify Elora project
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          required=(
            settings.gradle
            build.gradle
            app/build.gradle
            app/src/main/AndroidManifest.xml
            app/src/main/java/com/elora/dashboard/MainActivity.java
            app/src/main/assets/Elora_Dashboard.html
            app/src/main/assets/index.html
          )

          for file in "${required[@]}"; do
            [[ -f "$file" ]] || {
              echo "Missing: $file"
              exit 1
            }
          done

          echo "Elora project verified successfully."

      - name: Build Debug APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          gradle :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            --warning-mode all

      - name: Prepare APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          [[ -f "$APK" ]] || {
            echo "APK was not generated."
            exit 1
          }

          cp "$APK" Elora-Dashboard.apk

          ls -lh Elora-Dashboard.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Elora-Dashboard-APK
          path: Elora-Dashboard.apk
          if-no-files-found: error
