name: Build Elora Dashboard APK

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: elora-dashboard-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      # 1) تحميل المشروع
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2) إعداد Java 17
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3) إعداد Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 4) تثبيت Android SDK المطلوب
      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # 5) إعداد Gradle 8.7
      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
          cache-disabled: true

      # 6) التحقق من البيئة
      - name: Check build environment
        run: |
          echo "Java:"
          java -version

          echo "Gradle:"
          gradle --version

          echo "Android SDK:"
          echo "$ANDROID_HOME"

      # 7) تنظيف المشروع
      - name: Clean project
        run: |
          gradle --no-daemon clean

      # 8) بناء نسخة Debug قابلة للتثبيت
      - name: Build Debug APK
        run: |
          gradle \
            --no-daemon \
            --stacktrace \
            --warning-mode all \
            :app:assembleDebug

      # 9) التأكد من وجود APK
      - name: Verify APK
        run: |
          ls -lah app/build/outputs/apk/debug/

          test -f app/build/outputs/apk/debug/app-debug.apk

      # 10) إعادة تسمية APK باسم واضح
      - name: Prepare APK
        run: |
          mkdir -p release

          cp \
            app/build/outputs/apk/debug/app-debug.apk \
            release/Elora-Dashboard-v1.3.0-debug.apk

          ls -lah release/

      # 11) رفع APK كـ GitHub Artifact
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Elora-Dashboard-v1.3.0-Debug
          path: release/Elora-Dashboard-v1.3.0-debug.apk
          if-no-files-found: error
          retention-days: 30
