name: Elora Dashboard APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Elora Dashboard
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Find and extract project
        shell: bash
        run: |
          set -e

          echo "Searching for Elora project ZIP..."

          ZIP_FILE=$(find . -maxdepth 2 -type f -iname 'Elora_Dashboard*.zip' | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Elora Dashboard ZIP was not found."
            find . -maxdepth 3 -type f -print
            exit 1
          fi

          echo "Found:"
          echo "$ZIP_FILE"

          rm -rf android-project
          mkdir -p android-project

          unzip -q "$ZIP_FILE" -d android-project

          echo "Searching extracted project..."

          SETTINGS_FILE=$(find android-project \
            -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            | head -n 1)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle was not found after extraction."
            find android-project -maxdepth 5 -type f -print
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo "Android project:"
          echo "$PROJECT_DIR"

          test -f "$PROJECT_DIR/app/build.gradle" || \
          test -f "$PROJECT_DIR/app/build.gradle.kts"

          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml"

          echo "Project structure verified."

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
          cache-disabled: true

      - name: Verify Firebase configuration
        shell: bash
        run: |
          set -e

          FIREBASE="$PROJECT_DIR/app/src/main/assets/firebase-config.json"

          if [ ! -f "$FIREBASE" ]; then
            echo "ERROR: Firebase configuration not found:"
            echo "$FIREBASE"
            exit 1
          fi

          echo "Firebase configuration found."

      - name: Build APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "=== Gradle version ==="
          gradle --version

          echo "=== Building Elora Dashboard ==="

          gradle \
            --no-daemon \
            --stacktrace \
            clean \
            assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "ERROR: APK was not generated."
            find "$PROJECT_DIR/app/build/outputs" -type f 2>/dev/null || true
            exit 1
          fi

          echo "APK successfully generated:"
          ls -lh "$APK"

      - name: Prepare artifact
        shell: bash
        run: |
          set -e

          mkdir -p release

          cp \
            "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" \
            "release/Elora-Dashboard-v1.8.1.apk"

          ls -lh release/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Elora-Dashboard-v1.8.1
          path: release/Elora-Dashboard-v1.8.1.apk
          if-no-files-found: error
          retention-days: 30
