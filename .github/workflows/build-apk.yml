name: Elora Dashboard APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Elora Dashboard
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Find and extract Elora project
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "Searching for Elora Dashboard ZIP..."
          echo "======================================"

          ZIP_FILE=$(find . -maxdepth 3 -type f \
            -iname 'Elora_Dashboard*.zip' \
            | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Elora Dashboard ZIP was not found."
            echo ""
            echo "Files found:"
            find . -maxdepth 4 -type f -print
            exit 1
          fi

          echo "Found ZIP:"
          echo "$ZIP_FILE"

          rm -rf android-project
          mkdir -p android-project

          echo "Extracting project..."
          unzip -q "$ZIP_FILE" -d android-project

          echo "Searching for settings.gradle..."

          SETTINGS_FILE=$(find android-project \
            -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            | head -n 1)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle was not found."

            echo ""
            echo "Extracted files:"
            find android-project -maxdepth 6 -type f -print

            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo ""
          echo "======================================"
          echo "Android project found:"
          echo "$PROJECT_DIR"
          echo "======================================"

          if [ ! -f "$PROJECT_DIR/app/build.gradle" ] &&
             [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "ERROR: app/build.gradle was not found."
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml" ]; then
            echo "ERROR: AndroidManifest.xml was not found."
            exit 1
          fi

          echo "Project structure verified."

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        shell: bash
        run: |
          set -e

          echo "Accepting Android SDK licenses..."

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          echo "Installing Android SDK..."

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
          cache-disabled: true

      - name: Verify project files
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "Checking important files..."
          echo "======================================"

          test -f "$PROJECT_DIR/settings.gradle" || \
          test -f "$PROJECT_DIR/settings.gradle.kts"

          test -f "$PROJECT_DIR/build.gradle" || \
          test -f "$PROJECT_DIR/build.gradle.kts"

          test -f "$PROJECT_DIR/app/build.gradle" || \
          test -f "$PROJECT_DIR/app/build.gradle.kts"

          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml"

          echo "Core Android files: OK"

          FIREBASE="$PROJECT_DIR/app/src/main/assets/firebase-config.json"

          if [ -f "$FIREBASE" ]; then
            echo "Firebase configuration: OK"
          else
            echo "WARNING: firebase-config.json not found."
          fi

      - name: Build APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "======================================"
          echo "Gradle version"
          echo "======================================"

          gradle --version

          echo ""
          echo "======================================"
          echo "BUILDING ELORA DASHBOARD"
          echo "======================================"

          gradle \
            --no-daemon \
            --stacktrace \
            clean \
            assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          echo "======================================"
          echo "Checking APK..."
          echo "======================================"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was NOT generated."

            echo ""
            echo "Available output files:"
            find "$PROJECT_DIR/app/build/outputs" \
              -type f \
              -print 2>/dev/null || true

            exit 1
          fi

          if [ ! -s "$APK" ]; then
            echo "ERROR: APK is empty."
            exit 1
          fi

          echo "APK BUILD SUCCESSFUL!"
          ls -lh "$APK"

      - name: Prepare APK
        shell: bash
        run: |
          set -e

          mkdir -p release

          cp \
            "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" \
            "release/Elora-Dashboard-v1.8.2.apk"

          echo "Final APK:"
          ls -lh release/Elora-Dashboard-v1.8.2.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Elora-Dashboard-v1.8.2
          path: release/Elora-Dashboard-v1.8.2.apk
          if-no-files-found: error
          retention-days: 30
