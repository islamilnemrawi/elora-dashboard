name: Elora Dashboard - Professional APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Elora Dashboard
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1 - Checkout
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================
      # 2 - Java 17
      # ==========================================
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'


      # ==========================================
      # 3 - Android SDK
      # ==========================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3


      # ==========================================
      # 4 - Android SDK 35
      # ==========================================
      - name: Install Android SDK
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo "Android SDK 35 installed successfully."


      # ==========================================
      # 5 - Detect / Extract Project
      # ==========================================
      - name: Prepare Android project
        shell: bash
        run: |
          set -e

          echo "Checking Android project..."

          if [ -f "settings.gradle" ] || [ -f "settings.gradle.kts" ]; then

            echo "Android project already exists in repository root."

          else

            ZIP_FILE="$(find . -maxdepth 3 -type f -name '*.zip' -print -quit)"

            if [ -z "$ZIP_FILE" ]; then
              echo "ERROR: No Android project or ZIP file found."
              exit 1
            fi

            echo "Found project ZIP:"
            echo "$ZIP_FILE"

            TEMP_DIR=".elora_extract"

            rm -rf "$TEMP_DIR"
            mkdir -p "$TEMP_DIR"

            unzip -q "$ZIP_FILE" -d "$TEMP_DIR"

            echo "ZIP extracted."

            PROJECT_ROOT=""

            if [ -f "$TEMP_DIR/settings.gradle" ]; then
              PROJECT_ROOT="$TEMP_DIR"

            elif [ -f "$TEMP_DIR/settings.gradle.kts" ]; then
              PROJECT_ROOT="$TEMP_DIR"

            else

              PROJECT_SETTINGS="$(
                find "$TEMP_DIR" \
                  -type f \
                  -name 'settings.gradle' \
                  -print \
                  -quit
              )"

              if [ -n "$PROJECT_SETTINGS" ]; then
                PROJECT_ROOT="$(dirname "$PROJECT_SETTINGS")"
              fi

            fi

            if [ -z "$PROJECT_ROOT" ]; then

              PROJECT_SETTINGS="$(
                find "$TEMP_DIR" \
                  -type f \
                  -name 'settings.gradle.kts' \
                  -print \
                  -quit
              )"

              if [ -n "$PROJECT_SETTINGS" ]; then
                PROJECT_ROOT="$(dirname "$PROJECT_SETTINGS")"
              fi

            fi

            if [ -z "$PROJECT_ROOT" ]; then
              echo "ERROR: settings.gradle was not found."
              exit 1
            fi

            echo "Project root:"
            echo "$PROJECT_ROOT"

            cp -R "$PROJECT_ROOT"/. .

            rm -rf "$TEMP_DIR"

            echo "Android project prepared."

          fi


      # ==========================================
      # 6 - Verify Project
      # ==========================================
      - name: Verify Android project
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "ANDROID PROJECT CHECK"
          echo "======================================"

          if [ ! -f "settings.gradle" ] && \
             [ ! -f "settings.gradle.kts" ]; then
            echo "ERROR: settings.gradle not found."
            exit 1
          fi

          if [ ! -f "app/build.gradle" ] && \
             [ ! -f "app/build.gradle.kts" ]; then
            echo "ERROR: app module not found."
            exit 1
          fi

          echo "settings.gradle: OK"
          echo "app module: OK"

          echo
          echo "Project structure:"
          ls -la


      # ==========================================
      # 7 - Setup Gradle
      # ==========================================
      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'


      # ==========================================
      # 8 - Prepare Gradle
      # ==========================================
      - name: Prepare Gradle
        shell: bash
        run: |
          set -e

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            echo "Gradle Wrapper detected."
          else
            echo "Gradle Wrapper not included."
            echo "Using Gradle 8.7."
          fi


      # ==========================================
      # 9 - Clean
      # ==========================================
      - name: Clean project
        shell: bash
        run: |
          set -e

          if [ -f "./gradlew" ]; then
            ./gradlew clean --no-daemon
          else
            gradle clean --no-daemon
          fi


      # ==========================================
      # 10 - Build APK
      # ==========================================
      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "BUILDING ELORA DASHBOARD APK"
          echo "======================================"

          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug \
              --no-daemon \
              --stacktrace
          else
            gradle assembleDebug \
              --no-daemon \
              --stacktrace
          fi

          echo "APK build completed."


      # ==========================================
      # 11 - Find APK
      # ==========================================
      - name: Verify generated APK
        shell: bash
        run: |
          set -e

          APK_FILE="$(
            find . \
              -type f \
              -path '*/build/outputs/apk/*.apk' \
              -print \
              -quit
          )"

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: APK was not generated."
            echo
            echo "Build output:"
            find . \
              -type f \
              -path '*/build/*' \
              -print | head -100
            exit 1
          fi

          echo "======================================"
          echo "APK SUCCESSFULLY GENERATED"
          echo "======================================"

          echo "APK:"
          echo "$APK_FILE"

          ls -lh "$APK_FILE"


      # ==========================================
      # 12 - Rename APK
      # ==========================================
      - name: Prepare release APK
        shell: bash
        run: |
          set -e

          APK_FILE="$(
            find . \
              -type f \
              -path '*/build/outputs/apk/*.apk' \
              -print \
              -quit
          )"

          mkdir -p release

          cp "$APK_FILE" \
            "release/Elora-Dashboard.apk"

          echo "Final APK:"
          ls -lh release/Elora-Dashboard.apk


      # ==========================================
      # 13 - Upload APK
      # ==========================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Elora-Dashboard-APK
          path: release/Elora-Dashboard.apk
          if-no-files-found: error
          retention-days: 30
