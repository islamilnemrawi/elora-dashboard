name: Build Elora Dashboard APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Elora Dashboard
    runs-on: ubuntu-latest

    steps:

      # 1 - تحميل المشروع
      - name: Checkout
        uses: actions/checkout@v4

      # 2 - استخراج ZIP
      - name: Extract Elora ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 2 -type f -name '*.zip' | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Elora ZIP file not found."
            exit 1
          fi

          echo "Found ZIP:"
          echo "$ZIP_FILE"

          rm -rf extracted
          mkdir -p extracted

          unzip -q "$ZIP_FILE" -d extracted

      # 3 - تحديد مكان مشروع Android
      - name: Locate Android Project
        shell: bash
        run: |
          set -e

          SETTINGS_FILE=$(find extracted -type f \
            -name 'settings.gradle' -o -name 'settings.gradle.kts' \
            | head -n 1)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle not found."
            find extracted -maxdepth 5 -type f | sort
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo "Android project:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # 4 - Java
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 5 - Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 6 - تثبيت أدوات Android
      - name: Install Android SDK
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses > /dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # 7 - تثبيت Gradle
      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # 8 - فحص المشروع
      - name: Verify Android Project
        shell: bash
        run: |
          set -e

          echo "Checking project..."

          test -d "$PROJECT_DIR/app"

          if [ -f "$PROJECT_DIR/settings.gradle" ]; then
            echo "settings.gradle OK"
          elif [ -f "$PROJECT_DIR/settings.gradle.kts" ]; then
            echo "settings.gradle.kts OK"
          else
            echo "ERROR: Gradle settings file missing."
            exit 1
          fi

          if [ -f "$PROJECT_DIR/build.gradle" ]; then
            echo "build.gradle OK"
          elif [ -f "$PROJECT_DIR/build.gradle.kts" ]; then
            echo "build.gradle.kts OK"
          else
            echo "ERROR: Root build.gradle missing."
            exit 1
          fi

          echo "Android project is ready."

      # 9 - Build APK
      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "Starting Elora APK build..."

          gradle clean assembleDebug --stacktrace

      # 10 - البحث عن APK
      - name: Find APK
        shell: bash
        run: |
          set -e

          echo "APK files:"

          find "$PROJECT_DIR/app/build/outputs/apk" \
            -type f \
            -name '*.apk' \
            -print

      # 11 - رفع APK كـ Artifact
      - name: Upload APK
