name: Build Elora Dashboard APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-disabled: true

      - name: Find Elora project
        shell: bash
        run: |
          set -e

          if [ -f settings.gradle ] && [ -f app/build.gradle ]; then
            echo "PROJECT_DIR=." >> "$GITHUB_ENV"
            exit 0
          fi

          mkdir -p _elora

          ZIP_FILE=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Elora ZIP not found"
            exit 1
          fi

          unzip -q "$ZIP_FILE" -d _elora

          SETTINGS=$(find _elora -type f \
            -name settings.gradle \
            -print | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          if [ ! -f "$PROJECT_DIR/app/build.gradle" ]; then
            echo "ERROR: app/build.gradle not found"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Verify project
        run: |
          set -e
          cd "$PROJECT_DIR"

          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/elora/dashboard/MainActivity.java
          test -f app/src/main/assets/Elora_Dashboard.html
          test -f app/src/main/assets/index.html

          echo "Elora project verified."

      - name: Build APK
        run: |
          set -e
          cd "$PROJECT_DIR"

          gradle :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            --warning-mode all

      - name: Verify APK
        run: |
          set -e

          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated"
            exit 1
          fi

          cp "$APK" \
            "$GITHUB_WORKSPACE/Elora-Dashboard-v1.9.12.apk"

          ls -lh "$GITHUB_WORKSPACE/Elora-Dashboard-v1.9.12.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Elora-Dashboard-v1.9.12
          path: Elora-Dashboard-v1.9.12.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.9.12
          name: Elora Dashboard v1.9.12
          generate_release_notes: true
          files: Elora-Dashboard-v1.9.12.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
