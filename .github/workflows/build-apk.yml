name: ELORA Dashboard - Build Signed APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build ELORA Release APK
    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # 1. Checkout
      # =========================================================
      - name: Checkout repository
        uses: actions/checkout@v6

      # =========================================================
      # 2. Java 17
      # =========================================================
      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      # =========================================================
      # 3. Android SDK
      # =========================================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      # =========================================================
      # 4. Setup Gradle 8.9
      # =========================================================
      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      # =========================================================
      # 5. Find Dashboard ZIP
      # =========================================================
      - name: Find Dashboard source ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP="$(find . -type f \
            -name 'Elora_Dashboard_v1_9_11_PRO_FINAL.zip' \
            -print -quit)"

          if [ -z "$ZIP" ]; then
            echo "ERROR: Elora Dashboard source ZIP was not found."
            echo
            echo "ZIP files found:"
            find . -type f -name '*.zip' -print || true
            exit 1
          fi

          echo "SOURCE_ZIP=$ZIP" >> "$GITHUB_ENV"

          echo "Using:"
          echo "$ZIP"

      # =========================================================
      # 6. Extract
      # =========================================================
      - name: Extract Dashboard
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$GITHUB_WORKSPACE/elora-build"

          mkdir -p "$GITHUB_WORKSPACE/elora-build"

          unzip -q "$SOURCE_ZIP" \
            -d "$GITHUB_WORKSPACE/elora-build"

          echo "Extracted files:"
          find "$GITHUB_WORKSPACE/elora-build" \
            -maxdepth 4 \
            -type f \
            | sort \
            | head -300

      # =========================================================
      # 7. Detect Android project
      # =========================================================
      - name: Detect Android project
        shell: bash
        run: |
          set -euo pipefail

          SETTINGS="$(find "$GITHUB_WORKSPACE/elora-build" \
            -type f \
            \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) \
            -print -quit)"

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle not found."
            exit 1
          fi

          PROJECT_ROOT="$(dirname "$SETTINGS")"

          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"

          echo "Android project:"
          echo "$PROJECT_ROOT"

          if [ ! -f "$PROJECT_ROOT/app/build.gradle" ] && \
             [ ! -f "$PROJECT_ROOT/app/build.gradle.kts" ]; then
            echo "ERROR: app module not found."
            exit 1
          fi

      # =========================================================
      # 8. Create Gradle Wrapper
      # =========================================================
      - name: Create Gradle Wrapper
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -euo pipefail

          gradle wrapper \
            --gradle-version 8.9 \
            --distribution-type bin

          chmod +x gradlew

          echo "Gradle wrapper:"
          ./gradlew --version

      # =========================================================
      # 9. Verify Android package
      # =========================================================
      - name: Verify Android package
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking applicationId..."

          if [ -f app/build.gradle ]; then
            grep -n "applicationId" app/build.gradle || true
          fi

          echo
          echo "Checking Android project..."

          ./gradlew projects --no-daemon

      # =========================================================
      # 10. Prepare signing keystore
      # =========================================================
      - name: Prepare signing keystore
        shell: bash
        run: |
          set -euo pipefail

          SIGN_DIR="$RUNNER_TEMP/elora-signing"

          mkdir -p "$SIGN_DIR"

          echo "${{ secrets.ELORA_KEYSTORE_BASE64 }}" \
            | base64 --decode \
            > "$SIGN_DIR/elora-release.keystore"

          if [ ! -s "$SIGN_DIR/elora-release.keystore" ]; then
            echo "ERROR: Keystore was not created."
            exit 1
          fi

          echo "ELORA_KEYSTORE_FILE=$SIGN_DIR/elora-release.keystore" \
            >> "$GITHUB_ENV"

      # =========================================================
      # 11. Build Release
      # =========================================================
      - name: Build Release APK
        working-directory: ${{ env.PROJECT_ROOT }}
        env:
          ELORA_KEYSTORE_FILE: ${{ env.ELORA_KEYSTORE_FILE }}
          ELORA_KEYSTORE_PASSWORD: ${{ secrets.ELORA_KEYSTORE_PASSWORD }}
          ELORA_KEY_ALIAS: ${{ secrets.ELORA_KEY_ALIAS }}
          ELORA_KEY_PASSWORD: ${{ secrets.ELORA_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew \
            clean \
            :app:assembleRelease \
            --no-daemon \
            --stacktrace

      # =========================================================
      # 12. Find APK
      # =========================================================
      - name: Find generated APK
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Searching for Release APK..."

          find app/build/outputs/apk \
            -type f \
            -name '*.apk' \
            -print

          APK="$(find app/build/outputs/apk/release \
            -type f \
            -name '*.apk' \
            -print -quit)"

          if [ -z "$APK" ]; then
            echo "ERROR: No Release APK found."
            exit 1
          fi

          echo "RELEASE_APK=$PROJECT_ROOT/$APK" \
            >> "$GITHUB_ENV"

          echo "Found:"
          echo "$APK"

      # =========================================================
      # 13. Verify APK archive
      # =========================================================
      - name: Verify APK archive
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f "$RELEASE_APK" ]; then
            echo "ERROR: APK does not exist."
            exit 1
          fi

          echo "APK size:"
          ls -lh "$RELEASE_APK"

          echo
          echo "Testing APK archive..."

          unzip -t "$RELEASE_APK" >/dev/null

          echo "APK archive: OK"

      # =========================================================
      # 14. Verify APK signature
      # =========================================================
      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking APK signature..."

          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"

          if [ ! -f "$APKSIGNER" ]; then
            APKSIGNER="$(find "$ANDROID_HOME/build-tools" \
              -type f \
              -name apksigner \
              | sort \
              | tail -n 1)"
          fi

          if [ -z "$APKSIGNER" ] || [ ! -f "$APKSIGNER" ]; then
            echo "ERROR: apksigner not found."
            exit 1
          fi

          "$APKSIGNER" verify \
            --verbose \
            "$RELEASE_APK"

          echo
          echo "APK signature verification: OK"

      # =========================================================
      # 15. Verify package name
      # =========================================================
      - name: Verify package name
        shell: bash
        run: |
          set -euo pipefail

          AAPT="$(find "$ANDROID_HOME/build-tools" \
            -type f \
            -name aapt \
            | sort \
            | tail -n 1)"

          if [ -z "$AAPT" ]; then
            echo "ERROR: aapt not found."
            exit 1
          fi

          echo "APK information:"
          "$AAPT" dump badging "$RELEASE_APK" | head -n 5

          PACKAGE="$("$AAPT" dump badging "$RELEASE_APK" \
            | sed -n "s/^package: name='\([^']*\)'.*/\1/p" \
            | head -n 1)"

          echo
          echo "Detected package:"
          echo "$PACKAGE"

          if [ "$PACKAGE" != "com.elora.dashboard" ]; then
            echo
            echo "ERROR: Wrong application package."
            echo "Expected: com.elora.dashboard"
            echo "Found:    $PACKAGE"
            exit 1
          fi

          echo
          echo "Package verification: OK"

      # =========================================================
      # 16. Prepare final APK
      # =========================================================
      - name: Prepare final APK
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$GITHUB_WORKSPACE/final-apk"

          mkdir -p "$GITHUB_WORKSPACE/final-apk"

          cp "$RELEASE_APK" \
            "$GITHUB_WORKSPACE/final-apk/Elora-Dashboard.apk"

          echo "FINAL_APK=$GITHUB_WORKSPACE/final-apk/Elora-Dashboard.apk" \
            >> "$GITHUB_ENV"

          echo "Final APK:"
          ls -lh "$GITHUB_WORKSPACE/final-apk/Elora-Dashboard.apk"

      # =========================================================
      # 17. Final verification
      # =========================================================
      - name: Final APK verification
        shell: bash
        run: |
          set -euo pipefail

          test -s "$FINAL_APK"

          unzip -t "$FINAL_APK" >/dev/null

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" \
            -type f \
            -name apksigner \
            | sort \
            | tail -n 1)"

          "$APKSIGNER" verify \
            "$FINAL_APK"

          echo
          echo "========================================"
          echo "ELORA APK IS VALID AND SIGNED"
          echo "========================================"
          echo
          ls -lh "$FINAL_APK"

      # =========================================================
      # 18. Upload final APK
      # =========================================================
      - name: Upload final ELORA APK
        uses: actions/upload-artifact@v5
        with:
          name: ELORA-Dashboard-APK
          path: final-apk/Elora-Dashboard.apk
          if-no-files-found: error
          retention-days: 30

      # =========================================================
      # 19. Upload mapping
      # =========================================================
      - name: Upload mapping
        uses: actions/upload-artifact@v5
        with:
          name: ELORA-Dashboard-Mapping
          path: |
            ${{ env.PROJECT_ROOT }}/app/build/outputs/mapping/release/**
          if-no-files-found: ignore
          retention-days: 30

      # =========================================================
      # 20. Cleanup
      # =========================================================
      - name: Cleanup signing files
        if: always()
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/elora-signing"
