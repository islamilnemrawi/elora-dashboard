name: Build Elora Dashboard APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find Elora Android ZIP
        id: find_zip
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 3 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No Android ZIP file found."
            exit 1
          fi

          echo "Found ZIP:"
          echo "$ZIP_FILE"

          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      - name: Extract Android project
        shell: bash
        run: |
          set -e

          ZIP_FILE="${{ steps.find_zip.outputs.zip_file }}"

          rm -rf /tmp/elora_dashboard
          mkdir -p /tmp/elora_dashboard

          unzip -q "$ZIP_FILE" -d /tmp/elora_dashboard

          echo "Extracted files:"
          find /tmp/elora_dashboard -maxdepth 6 -type f | sort | head -300

      - name: Locate Android project
        id: locate
        shell: bash
        run: |
          set -e

          PROJECT_DIR=$(find /tmp/elora_dashboard \
            -type f \
            -name "settings.gradle" \
            -print -quit | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: settings.gradle not found."
            exit 1
          fi

          echo "Android project found at:"
          echo "$PROJECT_DIR"

          test -f "$PROJECT_DIR/settings.gradle"
          test -f "$PROJECT_DIR/build.gradle"
          test -f "$PROJECT_DIR/app/build.gradle"
          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Verify Elora Dashboard files
        shell: bash
        run: |
          set -e

          PROJECT_DIR="${{ steps.locate.outputs.project_dir }}"

          test -f "$PROJECT_DIR/app/src/main/assets/Elora_Dashboard.html"
          test -f "$PROJECT_DIR/app/src/main/assets/index.html"
          test -f "$PROJECT_DIR/app/src/main/assets/supabase-config.js"
          test -f "$PROJECT_DIR/app/src/main/java/com/elora/dashboard/MainActivity.java"

          echo "======================================"
          echo "Elora Dashboard project verified"
          echo "======================================"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Elora Dashboard APK
        working-directory: ${{ steps.locate.outputs.project_dir }}
        shell: bash
        run: |
          set -e

          echo "Starting APK build..."

          gradle --no-daemon \
            :app:assembleDebug \
            --stacktrace

          echo "======================================"
          echo "APK BUILD SUCCESSFUL"
          echo "======================================"

          ls -lh app/build/outputs/apk/debug/

      - name: Rename APK
        shell: bash
        run: |
          set -e

          PROJECT_DIR="${{ steps.locate.outputs.project_dir }}"

          cp \
            "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" \
            "$GITHUB_WORKSPACE/Elora-Dashboard-Premium.apk"

          ls -lh "$GITHUB_WORKSPACE/Elora-Dashboard-Premium.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Elora-Dashboard-Premium
          path: Elora-Dashboard-Premium.apk
          if-no-files-found: error
          retention-days: 30
