name: Build Elora Dashboard APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Elora Dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:

      # 1 — Checkout
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2 — Java 17
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3 — Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 4 — Install Android SDK
      - name: Install Android SDK 35
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # 5 — Extract Elora source
      - name: Prepare Android project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf android-project
          mkdir -p android-project

          echo "======================================"
          echo "Repository files"
          echo "======================================"

          find . -maxdepth 3 -type f | sort | head -200

          ZIP_FILE=""

          ZIP_FILE="$(find . \
            -type f \
            -iname 'Elora_Dashboard*.zip' \
            -not -path './android-project/*' \
            | head -n 1 || true)"

          if [ -n "$ZIP_FILE" ]; then

            echo ""
            echo "Found Elora source:"
            echo "$ZIP_FILE"

            unzip -q "$ZIP_FILE" -d android-project

          else

            echo ""
            echo "No Elora ZIP found."
            echo "Checking repository directly..."

            if [ -f "settings.gradle" ] || [ -f "settings.gradle.kts" ]; then

              cp -R . android-project/

            elif [ -d "app" ]; then

              cp -R . android-project/

            else

              echo ""
              echo "ERROR: Android project was not found."
              exit 1

            fi

          fi

          echo ""
          echo "======================================"
          echo "Finding Android project"
          echo "======================================"

          SETTINGS_FILE="$(
            find android-project \
              -type f \
              \( \
                -name 'settings.gradle' \
                -o \
                -name 'settings.gradle.kts' \
              \) \
              -print \
              | head -n 1 \
          )"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle not found."
            echo ""
            echo "Extracted files:"
            find android-project -maxdepth 5 -type f | sort | head -300
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"

          echo "PROJECT_DIR=$PROJECT_DIR"

          if [ ! -d "$PROJECT_DIR/app" ]; then
            echo ""
            echo "ERROR: app directory not found."
            echo ""
            echo "Project contents:"
            find "$PROJECT_DIR" -maxdepth 4 -type f | sort
            exit 1
          fi

          echo ""
          echo "Android project verified successfully."

          echo "$PROJECT_DIR" > project_dir.txt

      # 6 — Gradle 8.9
      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # 7 — Verify important files
      - name: Verify project files
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_DIR="$(cat project_dir.txt)"

          echo "======================================"
          echo "Project verification"
          echo "======================================"

          test -f "$PROJECT_DIR/settings.gradle" \
            && echo "✓ settings.gradle"

          test -f "$PROJECT_DIR/build.gradle" \
            && echo "✓ build.gradle"

          test -f "$PROJECT_DIR/app/build.gradle" \
            && echo "✓ app/build.gradle"

          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml" \
            && echo "✓ AndroidManifest.xml"

          test -f "$PROJECT_DIR/app/src/main/assets/firebase-config.json" \
            && echo "✓ firebase-config.json"

          test -f "$PROJECT_DIR/app/src/main/assets/supabase-config.js" \
            && echo "✓ supabase-config.js"

          echo ""
          echo "All required files are present."

      # 8 — Build APK
      - name: Build Debug APK
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_DIR="$(cat project_dir.txt)"

          cd "$PROJECT_DIR"

          echo "======================================"
          echo "Building Elora Dashboard"
          echo "======================================"

          echo ""
          echo "Project:"
          pwd

          echo ""
          echo "Java:"
          java -version

          echo ""
          echo "Gradle:"
          gradle --version

          echo ""
          echo "Starting build..."

          gradle clean assembleDebug \
            --no-daemon \
            --stacktrace \
            --warning-mode all

      # 9 — Find and prepare APK
      - name: Prepare APK
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_DIR="$(cat project_dir.txt)"

          echo "======================================"
          echo "Searching for APK"
          echo "======================================"

          APK="$(
            find "$PROJECT_DIR/app/build/outputs/apk/debug" \
              -type f \
              -name '*.apk' \
              | head -n 1 \
          )"

          if [ -z "$APK" ]; then
            echo ""
            echo "ERROR: APK was not generated."
            echo ""
            echo "Build output:"
            find "$PROJECT_DIR/app/build" \
              -type f \
              | sort || true
            exit 1
          fi

          echo ""
          echo "APK found:"
          ls -lh "$APK"

          mkdir -p release

          cp "$APK" \
            "release/Elora-Dashboard-v1.9.2.apk"

          echo ""
          echo "Final APK:"
          ls -lh "release/Elora-Dashboard-v1.9.2.apk"

      # 10 — Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Elora-Dashboard-v1.9.2
          path: release/Elora-Dashboard-v1.9.2.apk
          if-no-files-found: error
          retention-days: 14

      # 11 — Final result
      - name: Build success
        shell: bash
        run: |
          echo ""
          echo "======================================"
          echo "     ELORA DASHBOARD BUILD SUCCESS"
          echo "======================================"
          echo ""
          echo "Version: 1.9.2"
          echo "APK: Elora-Dashboard-v1.9.2.apk"
          echo ""
          echo "The APK is available in Artifacts."
          echo "======================================"
