name: Build ELORA Dashboard APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # =========================================================
      # 1) Checkout
      # =========================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # =========================================================
      # 2) Java
      # =========================================================
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # =========================================================
      # 3) Gradle
      # =========================================================
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # =========================================================
      # 4) Android SDK + Build Tools + apksigner
      # =========================================================
      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail

          export ANDROID_HOME="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"

          if [ -z "${ANDROID_HOME:-}" ]; then
            echo "ANDROID_HOME is not configured."
            exit 1
          fi

          echo "ANDROID_HOME=$ANDROID_HOME"

          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -n 1 || true)"

          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME" -type f -name sdkmanager 2>/dev/null | head -n 1 || true)"
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found."
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER"

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"

          if [ ! -x "$APKSIGNER" ]; then
            APKSIGNER="$(find "$ANDROID_HOME/build-tools" \
              -type f \
              -name apksigner \
              -perm -111 \
              | sort -V \
              | tail -n 1 || true)"
          fi

          if [ -z "$APKSIGNER" ] || [ ! -x "$APKSIGNER" ]; then
            echo "ERROR: apksigner was not found."
            find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name apksigner -print || true
            exit 1
          fi

          echo "APKSIGNER=$APKSIGNER" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"

          "$APKSIGNER" --version

      # =========================================================
      # 5) Prepare project
      # Supports:
      # - project directly in repository
      # - Elora_Dashboard*.zip in repository
      # =========================================================
      - name: Prepare ELORA project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$RUNNER_TEMP/elora_project"
          mkdir -p "$RUNNER_TEMP/elora_project"

          if [ -f "app/build.gradle" ] && [ -f "settings.gradle" ]; then
            echo "Android project found directly in repository."
            PROJECT_DIR="$GITHUB_WORKSPACE"

          else
            ZIP_FILE="$(find "$GITHUB_WORKSPACE" \
              -type f \
              -name 'Elora_Dashboard*.zip' \
              -print \
              | sort \
              | head -n 1 || true)"

            if [ -z "$ZIP_FILE" ]; then
              echo "ERROR: Elora Dashboard ZIP was not found."
              echo "Repository files:"
              find "$GITHUB_WORKSPACE" -maxdepth 3 -type f | sort | head -n 300
              exit 1
            fi

            echo "Using ZIP:"
            echo "$ZIP_FILE"

            unzip -q "$ZIP_FILE" -d "$RUNNER_TEMP/elora_project"

            PROJECT_DIR="$(find "$RUNNER_TEMP/elora_project" \
              -type f \
              -name settings.gradle \
              -printf '%h\n' \
              | head -n 1 || true)"

            if [ -z "$PROJECT_DIR" ]; then
              echo "ERROR: settings.gradle was not found after extraction."
              find "$RUNNER_TEMP/elora_project" -maxdepth 4 -type f | sort | head -n 300
              exit 1
            fi
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project directory:"
          echo "$PROJECT_DIR"

          echo "Project files:"
          ls -la "$PROJECT_DIR"

          test -f "$PROJECT_DIR/settings.gradle"
          test -f "$PROJECT_DIR/build.gradle"
          test -f "$PROJECT_DIR/app/build.gradle"

      # =========================================================
      # 6) Verify applicationId + version
      # =========================================================
      - name: Verify ELORA application configuration
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "Checking applicationId..."
          grep -n "applicationId" app/build.gradle || true

          echo "Checking versionCode..."
          grep -n "versionCode" app/build.gradle || true

          echo "Checking versionName..."
          grep -n "versionName" app/build.gradle || true

          grep -Eq \
            "applicationId[[:space:]]*(=|[[:space:]])[[:space:]]*['\"]com\.elora\.dashboard['\"]" \
            app/build.gradle

          grep -Eq \
            "versionCode[[:space:]]*(=|[[:space:]])[[:space:]]*19" \
            app/build.gradle

          grep -Eq \
            "versionName[[:space:]]*(=|[[:space:]])[[:space:]]*['\"]1\.9\.13['\"]" \
            app/build.gradle

          echo "Application configuration verified successfully."

      # =========================================================
      # 7) Check signing secrets
      # =========================================================
      - name: Check release signing secrets
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ELORA_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ELORA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ELORA_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ELORA_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "$KEYSTORE_B64" ]; then
            echo "ERROR: ELORA_KEYSTORE_BASE64 is missing."
            exit 1
          fi

          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "ERROR: ELORA_KEYSTORE_PASSWORD is missing."
            exit 1
          fi

          if [ -z "$KEY_ALIAS" ]; then
            echo "ERROR: ELORA_KEY_ALIAS is missing."
            exit 1
          fi

          if [ -z "$KEY_PASSWORD" ]; then
            echo "ERROR: ELORA_KEY_PASSWORD is missing."
            exit 1
          fi

          echo "All signing secrets are present."

      # =========================================================
      # 8) Build unsigned release APK
      # =========================================================
      - name: Build release APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          gradle clean assembleRelease \
            --no-daemon \
            --stacktrace

          UNSIGNED_APK="$PROJECT_DIR/app/build/outputs/apk/release/app-release-unsigned.apk"

          if [ ! -f "$UNSIGNED_APK" ]; then
            echo "ERROR: Unsigned APK was not generated."
            find "$PROJECT_DIR/app/build/outputs" -type f -print || true
            exit 1
          fi

          echo "UNSIGNED_APK=$UNSIGNED_APK" >> "$GITHUB_ENV"

          ls -lh "$UNSIGNED_APK"

      # =========================================================
      # 9) Restore + validate release keystore
      # =========================================================
      - name: Prepare release keystore
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ELORA_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ELORA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ELORA_KEY_ALIAS }}
        run: |
          set -euo pipefail

          KEYSTORE_FILE="$RUNNER_TEMP/elora-release.keystore"

          CLEAN_B64="$(
            printf '%s' "$KEYSTORE_B64" |
            tr -d '[:space:]'
          )"

          if [ -z "$CLEAN_B64" ]; then
            echo "ERROR: Keystore Base64 is empty."
            exit 1
          fi

          printf '%s' "$CLEAN_B64" |
            base64 --decode > "$KEYSTORE_FILE"

          if [ ! -s "$KEYSTORE_FILE" ]; then
            echo "ERROR: Keystore file is empty."
            exit 1
          fi

          echo "Keystore restored."
          echo "Keystore size: $(wc -c < "$KEYSTORE_FILE") bytes"

          KEYSTORE_TYPE=""

          if keytool \
              -list \
              -v \
              -keystore "$KEYSTORE_FILE" \
              -storepass "$KEYSTORE_PASSWORD" \
              -storetype PKCS12 \
              >/dev/null 2>&1; then

            KEYSTORE_TYPE="PKCS12"

          elif keytool \
              -list \
              -v \
              -keystore "$KEYSTORE_FILE" \
              -storepass "$KEYSTORE_PASSWORD" \
              -storetype JKS \
              >/dev/null 2>&1; then

            KEYSTORE_TYPE="JKS"

          else
            echo "ERROR: The keystore cannot be opened with PKCS12 or JKS."
            echo "The GitHub secret ELORA_KEYSTORE_BASE64 or password may be incorrect."
            exit 1
          fi

          echo "Detected keystore type: $KEYSTORE_TYPE"

          keytool \
            -list \
            -v \
            -keystore "$KEYSTORE_FILE" \
            -storepass "$KEYSTORE_PASSWORD" \
            -storetype "$KEYSTORE_TYPE" \
            -alias "$KEY_ALIAS" \
            >/dev/null

          echo "Keystore alias verified."

          echo "KEYSTORE_FILE=$KEYSTORE_FILE" >> "$GITHUB_ENV"
          echo "ELORA_KEYSTORE_TYPE=$KEYSTORE_TYPE" >> "$GITHUB_ENV"

      # =========================================================
      # 10) Show certificate fingerprint
      # =========================================================
      - name: Verify signing certificate
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ELORA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ELORA_KEY_ALIAS }}
        run: |
          set -euo pipefail

          echo "Signing certificate:"
          keytool \
            -list \
            -v \
            -keystore "$KEYSTORE_FILE" \
            -storepass "$KEYSTORE_PASSWORD" \
            -storetype "$ELORA_KEYSTORE_TYPE" \
            -alias "$KEY_ALIAS" \
            | grep -E \
              "Owner:|SHA256:|Entry type:" \
              || true

      # =========================================================
      # 11) Sign APK
      # =========================================================
      - name: Sign release APK
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ELORA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ELORA_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ELORA_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          SIGNED_APK="$PROJECT_DIR/app/build/outputs/apk/release/Elora-Dashboard-v1.9.13.apk"

          rm -f "$SIGNED_APK"

          "$APKSIGNER" sign \
            --ks "$KEYSTORE_FILE" \
            --ks-type "$ELORA_KEYSTORE_TYPE" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out "$SIGNED_APK" \
            "$UNSIGNED_APK"

          if [ ! -f "$SIGNED_APK" ]; then
            echo "ERROR: Signed APK was not generated."
            exit 1
          fi

          echo "SIGNED_APK=$SIGNED_APK" >> "$GITHUB_ENV"

          ls -lh "$SIGNED_APK"

      # =========================================================
      # 12) Verify APK signature
      # =========================================================
      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail

          "$APKSIGNER" verify \
            --verbose \
            "$SIGNED_APK"

          echo "APK signature verified successfully."

      # =========================================================
      # 13) Upload APK artifact
      # =========================================================
      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Elora-Dashboard-v1.9.13
          path: ${{ env.SIGNED_APK }}
          if-no-files-found: error
          retention-days: 30

      # =========================================================
      # 14) Create GitHub Release
      # =========================================================
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.9.13
          name: Elora Dashboard v1.9.13
          body: |
            Elora Dashboard v1.9.13

            إصلاحات:
            - إصلاح أزرار لوحة التحكم والصلاحيات.
            - إصلاح ظهور الطلبات في آخر الطلبات.
            - إصلاح تفاصيل المنتجات داخل الطلب.
            - إظهار بيانات المنتج وسعر الجملة حسب الصلاحية.
            - إصلاح حساب تكلفة الجملة والربح.
            - تحسين عرض الطلبات على الهاتف.
            - الحفاظ على جميع التعديلات السابقة.
          files: ${{ env.SIGNED_APK }}
          overwrite_files: true
          fail_on_unmatched_files: true
