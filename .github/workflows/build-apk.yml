name: Build Elora Dashboard PRO

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build, Sign and Verify Elora Dashboard PRO
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:

      # ==========================================
      # 1. Checkout
      # ==========================================
      - name: Checkout
        uses: actions/checkout@v6


      # ==========================================
      # 2. Find and extract PRO
      # ==========================================
      - name: Find and extract Elora Dashboard PRO
        shell: bash
        run: |
          set -euo pipefail

          echo "Searching for Elora Dashboard PRO ZIP..."

          ZIP_FILE="$(find . -maxdepth 5 -type f \
            -iname 'Elora_Dashboard*.zip' \
            | head -n 1)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Elora Dashboard PRO ZIP was not found."
            exit 1
          fi

          echo "Using:"
          echo "$ZIP_FILE"

          rm -rf android-project
          mkdir -p android-project

          unzip -q "$ZIP_FILE" -d android-project

          SETTINGS_FILE="$(
            find android-project -type f \
              -name 'settings.gradle' -o -name 'settings.gradle.kts' \
              | head -n 1
          )"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle was not found."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"

          echo "PROJECT_DIR=$PROJECT_DIR"

          if [ ! -f "$PROJECT_DIR/app/build.gradle" ] && \
             [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "ERROR: app/build.gradle was not found."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"


      # ==========================================
      # 3. Java
      # ==========================================
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle


      # ==========================================
      # 4. Android SDK
      # ==========================================
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4


      # ==========================================
      # 5. Android SDK packages
      # ==========================================
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"


      # ==========================================
      # 6. Gradle
      # ==========================================
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'


      # ==========================================
      # 7. Prepare keystore
      # ==========================================
      - name: Prepare release keystore
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ELORA_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          if [ -z "$KEYSTORE_B64" ]; then
            echo "ERROR: ELORA_KEYSTORE_BASE64 is missing."
            exit 1
          fi

          echo "$KEYSTORE_B64" | base64 --decode \
            > "$RUNNER_TEMP/elora-release.keystore"

          test -s "$RUNNER_TEMP/elora-release.keystore"

          echo "ELORA_KEYSTORE_FILE=$RUNNER_TEMP/elora-release.keystore" \
            >> "$GITHUB_ENV"

          echo "Keystore prepared."


      # ==========================================
      # 8. Build PRO
      # ==========================================
      - name: Build Elora Dashboard PRO
        shell: bash
        env:
          ELORA_KEYSTORE_PASSWORD: ${{ secrets.ELORA_KEYSTORE_PASSWORD }}
          ELORA_KEY_ALIAS: ${{ secrets.ELORA_KEY_ALIAS }}
          ELORA_KEY_PASSWORD: ${{ secrets.ELORA_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "Building Android project..."

          gradle \
            --no-daemon \
            --stacktrace \
            clean \
            assembleRelease

          echo ""
          echo "Build finished."

          echo ""
          echo "Generated APK files:"
          find . \
            -type f \
            -name '*.apk' \
            -print


      # ==========================================
      # 9. Locate unsigned APK
      # ==========================================
      - name: Locate Release APK
        shell: bash
        run: |
          set -euo pipefail

          UNSIGNED_APK="$(
            find "$PROJECT_DIR" \
              -type f \
              -name '*-unsigned.apk' \
              -path '*/build/outputs/apk/*' \
              | head -n 1
          )"

          if [ -z "$UNSIGNED_APK" ]; then
            echo "ERROR: Unsigned Release APK was not found."

            echo ""
            echo "All APK files:"
            find "$PROJECT_DIR" \
              -type f \
              -name '*.apk' \
              -print || true

            exit 1
          fi

          echo "Unsigned APK:"
          echo "$UNSIGNED_APK"

          echo "ELORA_UNSIGNED_APK=$UNSIGNED_APK" \
            >> "$GITHUB_ENV"


      # ==========================================
      # 10. Sign APK
      # ==========================================
      - name: Sign Release APK
        shell: bash
        env:
          ELORA_KEYSTORE_PASSWORD: ${{ secrets.ELORA_KEYSTORE_PASSWORD }}
          ELORA_KEY_ALIAS: ${{ secrets.ELORA_KEY_ALIAS }}
          ELORA_KEY_PASSWORD: ${{ secrets.ELORA_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          UNSIGNED="$ELORA_UNSIGNED_APK"

          SIGNED="$RUNNER_TEMP/Elora-Dashboard-PRO-signed.apk"

          echo "Signing APK..."

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks "$ELORA_KEYSTORE_FILE" \
            --ks-key-alias "$ELORA_KEY_ALIAS" \
            --ks-pass "pass:$ELORA_KEYSTORE_PASSWORD" \
            --key-pass "pass:$ELORA_KEY_PASSWORD" \
            --out "$SIGNED" \
            "$UNSIGNED"

          if [ ! -s "$SIGNED" ]; then
            echo "ERROR: Signed APK was not created."
            exit 1
          fi

          echo "Signed APK created:"
          ls -lh "$SIGNED"

          echo "ELORA_SIGNED_APK=$SIGNED" \
            >> "$GITHUB_ENV"


      # ==========================================
      # 11. Verify signed APK
      # ==========================================
      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail

          echo "Verifying signed APK..."

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            verify \
            --verbose \
            "$ELORA_SIGNED_APK"

          echo ""
          echo "=========================================="
          echo "APK SIGNATURE VERIFIED SUCCESSFULLY"
          echo "=========================================="

          echo ""
          echo "Signed APK:"
          echo "$ELORA_SIGNED_APK"

          echo ""
          echo "Size:"
          ls -lh "$ELORA_SIGNED_APK"


      # ==========================================
      # 12. Verify package
      # ==========================================
      - name: Verify APK package
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking APK package information..."

          "$ANDROID_HOME/build-tools/35.0.0/aapt" \
            dump badging "$ELORA_SIGNED_APK" \
            | grep -E \
              "package:|versionCode=|versionName=" \
            | head -n 5 || true


      # ==========================================
      # 13. Upload
