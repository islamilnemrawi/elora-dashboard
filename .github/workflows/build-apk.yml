name: Build Elora Dashboard APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Elora Dashboard v1.9.4
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:

      # 1) تحميل ملفات GitHub
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2) العثور على ZIP الخاص بـ Elora
      - name: Locate Elora source ZIP
        shell: bash
        run: |
          set -euo pipefail

          shopt -s nullglob globstar

          ZIP_FILE=""

          for file in **/*.zip; do
            case "$file" in
              *Elora_Dashboard*.zip|*Elora-Dashboard*.zip)
                ZIP_FILE="$file"
                break
                ;;
            esac
          done

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Elora Dashboard ZIP not found."
            echo "ZIP files available:"
            printf '%s\n' **/*.zip || true
            exit 1
          fi

          echo "Found source ZIP:"
          echo "$ZIP_FILE"

          echo "ELORA_ZIP=$ZIP_FILE" >> "$GITHUB_ENV"

      # 3) فك ضغط المشروع
      - name: Extract Android project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf android-project
          mkdir -p android-project

          unzip -q "$ELORA_ZIP" -d android-project

          echo "Extracted project:"
          ls -la android-project

      # 4) تحديد مجلد Android الحقيقي
      - name: Locate Android project
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_DIR=""

          SETTINGS_FILE=$(find android-project \
            -type f \
            -name "settings.gradle" \
            -print \
            -quit)

          if [ -z "$SETTINGS_FILE" ]; then
            SETTINGS_FILE=$(find android-project \
              -type f \
              -name "settings.gradle.kts" \
              -print \
              -quit)
          fi

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: Android settings.gradle not found."

            echo "Extracted files:"
            find android-project -maxdepth 5 -type f -print

            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"

          echo "Android project:"
          echo "$PROJECT_DIR"

          if [ ! -f "$PROJECT_DIR/app/build.gradle" ] &&
             [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "ERROR: app/build.gradle not found."
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml" ]; then
            echo "ERROR: AndroidManifest.xml not found."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # 5) Java 17
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 6) Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 7) تثبيت Android SDK المطلوب
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # 8) تثبيت Gradle 8.9
      # لا نعتمد على gradle-wrapper الموجود داخل ZIP
      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
          cache-disabled: true

      # 9) فحص المشروع قبل البناء
      - name: Verify Android project
        shell: bash
        run: |
          set -euo pipefail

          echo "PROJECT_DIR=$PROJECT_DIR"

          test -f "$PROJECT_DIR/settings.gradle" \
            || test -f "$PROJECT_DIR/settings.gradle.kts"

          test -f "$PROJECT_DIR/build.gradle" \
            || test -f "$PROJECT_DIR/build.gradle.kts"

          test -f "$PROJECT_DIR/app/build.gradle" \
            || test -f "$PROJECT_DIR/app/build.gradle.kts"

          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml"

          echo "Android project verification: OK"

      # 10) فحص Manifest
      - name: Validate AndroidManifest.xml
        shell: bash
        run: |
          set -euo pipefail

          python3 - "$PROJECT_DIR/app/src/main/AndroidManifest.xml" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          manifest = sys.argv[1]

          ET.parse(manifest)

          print("AndroidManifest.xml: valid")
          PY

      # 11) تنظيف وبناء APK
      - name: Build Debug APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "Starting Gradle build..."

          gradle \
            --no-daemon \
            --stacktrace \
            --info \
            clean \
            assembleDebug

      # 12) البحث عن APK
      - name: Locate generated APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated."

            echo "Searching build directory:"
            find "$PROJECT_DIR/app/build" \
              -type f \
              -name "*.apk" \
              -print || true

            exit 1
          fi

          echo "APK found:"
          ls -lh "$APK"

          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      # 13) التأكد من أن APK سليم
      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          test -s "$APK_PATH"

          FILE_SIZE=$(stat -c%s "$APK_PATH")

          echo "APK size: $FILE_SIZE bytes"

          if [ "$FILE_SIZE" -lt 100000 ]; then
            echo "ERROR: APK file is suspiciously small."
            exit 1
          fi

          echo "APK verification: OK"

      # 14) تجهيز نسخة باسم واضح
      - name: Prepare final APK
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p release

          cp "$APK_PATH" \
            "release/Elora-Dashboard-v1.9.4.apk"

          ls -lh release/Elora-Dashboard-v1.9.4.apk

      # 15) رفع APK في Artifacts
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Elora-Dashboard-v1.9.4
          path: release/Elora-Dashboard-v1.9.4.apk
          if-no-files-found: error
          retention-days: 30
