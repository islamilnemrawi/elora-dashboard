name: Build Elora Dashboard APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:

      # 1) تحميل ملفات GitHub
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2) البحث عن ZIP الخاص بـ Elora
      - name: Locate Elora source ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$(find . -type f \
            \
              -iname 'Elora_Dashboard*.zip' \
              -o -iname 'Elora-Dashboard*.zip' \
            \
            | head -n 1)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Elora Dashboard ZIP was not found."
            echo
            echo "Repository files:"
            find . -maxdepth 4 -type f | sort
            exit 1
          fi

          echo "Found source:"
          echo "$ZIP_FILE"

          echo "SOURCE_ZIP=$ZIP_FILE" >> "$GITHUB_ENV"

      # 3) فك ZIP
      - name: Extract Android project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf android-project
          mkdir -p android-project

          unzip -q "$SOURCE_ZIP" -d android-project

          echo "Extracted project:"
          find android-project -maxdepth 5 -type f | sort | head -300

      # 4) تحديد مكان مشروع Android الحقيقي
      - name: Locate Android project
        shell: bash
        run: |
          set -euo pipefail

          SETTINGS_FILE="$(
            find android-project -type f \
              \
                -name 'settings.gradle' \
                -o -name 'settings.gradle.kts' \
              \
              -print -quit
          )"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle or settings.gradle.kts was not found."

            echo
            echo "Searching for Gradle files:"
            find android-project -type f \
              \
                -name '*.gradle' \
                -o -name '*.gradle.kts' \
              \
              | sort

            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"

          echo "Android project directory:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # 5) Java 17
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 6) Android SDK
