name: Elora Dashboard - Test Build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: elora-dashboard-test-build
  cancel-in-progress: true

jobs:
  build:
    name: Build Elora Dashboard Test APK
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate ZIP
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "Repository files:"
          ls -lah

          mapfile -t ZIPS < <(
            find . -maxdepth 2 -type f -iname "*.zip" -print
          )

          if [ "${#ZIPS[@]}" -eq 0 ]; then
            echo "::error::No ZIP file found."
            exit 1
          fi

          if [ "${#ZIPS[@]}" -gt 1 ]; then
            echo "::error::More than one ZIP file exists."
            printf '%s\n' "${ZIPS[@]}"
            exit 1
          fi

          ZIP_FILE="${ZIPS[0]}"

          echo "Using ZIP:"
          echo "$ZIP_FILE"

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Validate ZIP
        shell: bash
        run: |
          set -Eeuo pipefail
          unzip -t "$ZIP_FILE"

      - name: Extract Dashboard
        shell: bash
        run: |
          set -Eeuo pipefail

          rm -rf extracted
          mkdir -p extracted

          unzip -q "$ZIP_FILE" -d extracted

          echo "Extracted files:"
          find extracted -maxdepth 4 -type f -print | sort | head -300

      - name: Detect Android Project
        shell: bash
        run: |
          set -Eeuo pipefail

          SETTINGS_FILE="$(
            find extracted -type f \
              \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
              -print | head -n 1
          )"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "::error::settings.gradle was not found."

            find extracted -maxdepth 6 -type f -print

            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"

          echo "Android project:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Verify Android Project
        shell: bash
        run: |
          set -Eeuo pipefail

          if [ ! -d "$PROJECT_DIR/app" ]; then
            echo "::error::app module not found."
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/settings.gradle" ] &&
             [ ! -f "$PROJECT_DIR/settings.gradle.kts" ]; then
            echo "::error::settings.gradle not found."
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/build.gradle" ] &&
             [ ! -f "$PROJECT_DIR/build.gradle.kts" ]; then
            echo "::error::Root build.gradle not found."
            exit 1
          fi

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        shell: bash
        run: |
          set -Eeuo pipefail

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Verify Build Environment
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "Java:"
          java -version

          echo "Gradle:"
          gradle --version

      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -Eeuo pipefail

          gradle \
            --no-daemon \
            --stacktrace \
            --console=plain \
            assembleDebug

      - name: Locate APK
        shell: bash
        run: |
          set -Eeuo pipefail

          APK_FILE="$(
            find "$PROJECT_DIR" \
              -type f \
              -name "*.apk" \
              -print | head -n 1
          )"

          if [ -z "$APK_FILE" ]; then
            echo "::error::APK was not generated."
            exit 1
          fi

          mkdir -p release

          cp "$APK_FILE" \
            release/Elora_Dashboard_DEBUG.apk

          echo "APK generated:"
          ls -lh release/Elora_Dashboard_DEBUG.apk

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Elora-Dashboard-DEBUG-APK
          path: release/Elora_Dashboard_DEBUG.apk
          if-no-files-found: error
          retention-days: 7
