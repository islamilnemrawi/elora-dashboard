name: Build Elora Dashboard APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show repository files
        run: |
          set -e
          echo "Repository files:"
          ls -lah

      - name: Find Dashboard ZIP
        id: find_zip
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 2 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found."
            echo "Available files:"
            find . -maxdepth 3 -type f -print
            exit 1
          fi

          echo "Found ZIP:"
          echo "$ZIP_FILE"

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Test ZIP
        run: |
          set -e
          echo "Testing ZIP integrity..."
          unzip -t "$ZIP_FILE"

      - name: Extract Dashboard Project
        run: |
          set -e

          rm -rf extracted
          mkdir -p extracted

          echo "Extracting:"
          echo "$ZIP_FILE"

          unzip -q "$ZIP_FILE" -d extracted

          echo "Extracted files:"
          find extracted -maxdepth 3 -type f | head -100

      - name: Detect Android project root
        run: |
          set -e

          if [ -f "extracted/settings.gradle" ] || [ -f "extracted/settings.gradle.kts" ]; then
            PROJECT_DIR="extracted"

          elif [ -f "extracted/Elora_Dashboard/settings.gradle" ] || [ -f "extracted/Elora_Dashboard/settings.gradle.kts" ]; then
            PROJECT_DIR="extracted/Elora_Dashboard"

          else
            SETTINGS_FILE=$(find extracted -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) | head -n 1)

            if [ -z "$SETTINGS_FILE" ]; then
              echo "ERROR: Android project settings.gradle not found."
              echo "Extracted structure:"
              find extracted -maxdepth 5 -type f -print
              exit 1
            fi

            PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          fi

          echo "Android project root:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Show Android project
        run: |
          set -e

          echo "Project directory:"
          ls -lah "$PROJECT_DIR"

          echo ""
          echo "Project structure:"
          find "$PROJECT_DIR" -maxdepth 3 -type f -print | sort | head -200

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Make Gradle executable
        run: |
          set -e

          if [ -f "$PROJECT_DIR/gradlew" ]; then
            chmod +x "$PROJECT_DIR/gradlew"
          fi

      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          echo "Building Dashboard APK..."

          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --stacktrace
          else
            echo "ERROR: gradlew not found."
            ls -lah
            exit 1
          fi

      - name: Find APK
        run: |
          set -e

          echo "Searching for APK..."

          find "$PROJECT_DIR" -type f -name "*.apk" -print

          APK=$(find "$PROJECT_DIR" -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK found:"
          echo "$APK"

          mkdir -p release
          cp "$APK" release/Elora_Dashboard.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Elora-Dashboard-APK
          path: release/Elora_Dashboard.apk
          if-no-files-found: error
