name: Build Elora Dashboard APK

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Elora Dashboard 1.9.13
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. ANDROID SDK
      # ============================================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3


      # ============================================================
      # 3. JAVA
      # ============================================================

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ============================================================
      # 4. INSTALL REQUIRED ANDROID BUILD TOOLS
      # ============================================================

      - name: Install Android Build Tools
        shell: bash
        run: |
          set -euo pipefail

          echo "Installing Android Build Tools..."

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "build-tools;35.0.0"

          echo ""
          echo "Installed Android SDK packages:"
          sdkmanager --list_installed | grep -E \
            "build-tools|platform-tools" || true


      # ============================================================
      # 5. LOCATE APKSIGNER
      # ============================================================

      - name: Configure apksigner
        shell: bash
        run: |
          set -euo pipefail

          APKSIGNER=""

          # Prefer the requested Build Tools version.
          if [ -x "$ANDROID_HOME/build-tools/35.0.0/apksigner" ]; then
            APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          fi

          # Fallback: use the newest installed Build Tools.
          if [ -z "$APKSIGNER" ]; then
            APKSIGNER="$(
              find "$ANDROID_HOME/build-tools" \
                -type f \
                -name "apksigner" \
                -perm -111 \
                | sort -V \
                | tail -n 1
            )"
          fi

          if [ -z "$APKSIGNER" ] || [ ! -x "$APKSIGNER" ]; then
            echo "ERROR: apksigner was not found."
            echo ""
            echo "Android Build Tools installed:"
            find "$ANDROID_HOME/build-tools" \
              -maxdepth 2 \
              -type f \
              -name "apksigner" \
              -print || true
            exit 1
          fi

          echo "Using apksigner:"
          echo "$APKSIGNER"

          "$APKSIGNER" version

          echo "APKSIGNER=$APKSIGNER" >> "$GITHUB_ENV"


      # ============================================================
      # 6. FIND PROJECT ZIP
      # ============================================================

      - name: Find Elora project ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE=""

          while IFS= read -r -d '' file; do
            if unzip -Z1 "$file" | grep -Fxq "settings.gradle"; then
              ZIP_FILE="$file"
              break
            fi
          done < <(
            find "$GITHUB_WORKSPACE" \
              -maxdepth 1 \
              -type f \
              -name "*.zip" \
              -print0
          )

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Elora project ZIP was not found."

            find "$GITHUB_WORKSPACE" \
              -maxdepth 1 \
              -type f \
              -name "*.zip" \
              -print || true

            exit 1
          fi

          echo "Using project ZIP:"
          echo "$ZIP_FILE"

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"


      # ============================================================
      # 7. EXTRACT PROJECT
      # ============================================================

      - name: Extract Elora project
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_ROOT="$RUNNER_TEMP/elora_project"

          rm -rf "$PROJECT_ROOT"
          mkdir -p "$PROJECT_ROOT"

          unzip -q "$ZIP_FILE" -d "$PROJECT_ROOT"

          if [ -f "$PROJECT_ROOT/settings.gradle" ]; then
            PROJECT_DIR="$PROJECT_ROOT"
          else
            SETTINGS_FILE="$(
              find "$PROJECT_ROOT" \
                -type f \
                -name "settings.gradle" \
                -print -quit
            )"

            if [ -z "$SETTINGS_FILE" ]; then
              echo "ERROR: settings.gradle not found."
              exit 1
            fi

            PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo ""
          echo "Project directory:"
          echo "$PROJECT_DIR"


      # ============================================================
      # 8. VERIFY PROJECT
      # ============================================================

      - name: Verify Android project
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          REQUIRED_FILES=(
            "settings.gradle"
            "build.gradle"
            "app/build.gradle"
            "app/src/main/AndroidManifest.xml"
          )

          for file in "${REQUIRED_FILES[@]}"; do
            if [ ! -f "$file" ]; then
              echo "ERROR: Missing required file: $file"
              exit 1
            fi
          done

          echo "Android project structure verified."


      # ============================================================
      # 9. VERIFY ELORA VERSION
      # ============================================================

      - name: Verify Elora application configuration
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          GRADLE_FILE="app/build.gradle"

          echo "=============================================="
          echo "Elora application configuration"
          echo "=============================================="

          grep -nE \
            "applicationId|versionCode|versionName" \
            "$GRADLE_FILE" || true

          # Supports:
          # applicationId 'com.elora.dashboard'
          # applicationId "com.elora.dashboard"
          # applicationId = 'com.elora.dashboard'
          # applicationId = "com.elora.dashboard"

          if ! grep -Eq \
            "^[[:space:]]*applicationId[[:space:]]*(=[[:space:]]*)?['\"]com\.elora\.dashboard['\"]" \
            "$GRADLE_FILE"; then

            echo "ERROR: applicationId is not com.elora.dashboard"
            exit 1
          fi

          # Supports:
          # versionCode 19
          # versionCode = 19

          if ! grep -Eq \
            "^[[:space:]]*versionCode[[:space:]]*(=[[:space:]]*)?19([[:space:]]*(//.*)?)?$" \
            "$GRADLE_FILE"; then

            echo "ERROR: versionCode is not 19"
            exit 1
          fi

          # Supports:
          # versionName '1.9.13'
          # versionName "1.9.13"
          # versionName = '1.9.13'
          # versionName = "1.9.13"

          if ! grep -Eq \
            "^[[:space:]]*versionName[[:space:]]*(=[[:space:]]*)?['\"]1\.9\.13['\"]([[:space:]]*(//.*)?)?$" \
            "$GRADLE_FILE"; then

            echo "ERROR: versionName is not 1.9.13"
            exit 1
          fi

          echo ""
          echo "Elora 1.9.13 configuration VERIFIED."


      # ============================================================
      # 10. SETUP GRADLE
      # ============================================================

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"


      # ============================================================
      # 11. VERIFY GRADLE
      # ============================================================

      - name: Verify Gradle
        shell: bash
        run: |
          set -euo pipefail

          gradle --version

          echo "Gradle is ready."


      # ============================================================
      # 12. RESTORE RELEASE KEYSTORE
      # ============================================================

      - name: Restore release keystore
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ELORA_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ELORA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ELORA_KEY_ALIAS }}
        run: |
          set -euo pipefail

          echo "Preparing release keystore..."

          if [ -z "${KEYSTORE_B64:-}" ]; then
            echo "ERROR: ELORA_KEYSTORE_BASE64 is missing."
            exit 1
          fi

          if [ -z "${KEYSTORE_PASSWORD:-}" ]; then
            echo "ERROR: ELORA_KEYSTORE_PASSWORD is missing."
            exit 1
          fi

          if [ -z "${KEY_ALIAS:-}" ]; then
            echo "ERROR: ELORA_KEY_ALIAS is missing."
            exit 1
          fi

          KEYSTORE_FILE="$RUNNER_TEMP/elora-release.keystore"

          # Clean Base64 text only.
          # Never modify decoded binary data.

          CLEAN_B64="$(
            printf '%s' "$KEYSTORE_B64" |
            tr -d '[:space:]'
          )"

          if [ -z "$CLEAN_B64" ]; then
            echo "ERROR: Base64 keystore data is empty."
            exit 1
          fi

          if ! printf '%s' "$CLEAN_B64" |
            base64 --decode > "$KEYSTORE_FILE"; then

            echo "ERROR: Invalid Base64 keystore."
            exit 1
          fi

          if [ ! -s "$KEYSTORE_FILE" ]; then
            echo "ERROR: Decoded keystore is empty."
            exit 1
          fi

          KEYSTORE_SIZE="$(wc -c < "$KEYSTORE_FILE")"

          echo "Decoded keystore size: ${KEYSTORE_SIZE} bytes"

          if [ "$KEYSTORE_SIZE" -lt 100 ]; then
            echo "ERROR: Keystore is suspiciously small."
            exit 1
          fi

          echo "KEYSTORE_FILE=$KEYSTORE_FILE" >> "$GITHUB_ENV"


      # ============================================================
      # 13. DETECT KEYSTORE TYPE
      # ============================================================

      - name: Detect release keystore type
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ELORA_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail

          echo "Detecting keystore format..."

          KEYSTORE_TYPE=""

          if keytool \
            -list \
            -keystore "$KEYSTORE_FILE" \
            -storepass "$KEYSTORE_PASSWORD" \
            -storetype PKCS12 \
            >/dev/null 2>&1; then

            KEYSTORE_TYPE="PKCS12"

          elif keytool \
            -list \
            -keystore "$KEYSTORE_FILE" \
            -storepass "$KEYSTORE_PASSWORD" \
            -storetype JKS \
            >/dev/null 2>&1; then

            KEYSTORE_TYPE="JKS"

          else
            echo ""
            echo "=================================================="
            echo "ERROR: RELEASE KEYSTORE COULD NOT BE OPENED"
            echo "=================================================="
            echo ""
            exit 1
          fi

          echo "Detected keystore type: $KEYSTORE_TYPE"

          echo "ELORA_KEYSTORE_TYPE=$KEYSTORE_TYPE" >> "$GITHUB_ENV"


      # ============================================================
      # 14. VERIFY SIGNING ALIAS
      # ============================================================

      - name: Verify signing alias
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ELORA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ELORA_KEY_ALIAS }}
        run: |
          set -euo pipefail

          if ! keytool \
            -list \
            -keystore "$KEYSTORE_FILE" \
            -storepass "$KEYSTORE_PASSWORD" \
            -storetype "$ELORA_KEYSTORE_TYPE" \
            -alias "$KEY_ALIAS" \
            >/dev/null 2>&1; then

            echo "ERROR: Alias '$KEY_ALIAS' was not found."

            echo ""
            echo "Available aliases:"

            keytool \
              -list \
              -keystore "$KEYSTORE_FILE" \
              -storepass "$KEYSTORE_PASSWORD" \
              -storetype "$ELORA_KEYSTORE_TYPE" || true

            exit 1
          fi

          echo "Signing alias verified."


      # ============================================================
      # 15. VERIFY CERTIFICATE
      # ============================================================

      - name: Verify release certificate
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ELORA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ELORA_KEY_ALIAS }}
        run: |
          set -euo pipefail

          echo "Release certificate:"

          keytool \
            -list \
            -v \
            -keystore "$KEYSTORE_FILE" \
            -storepass "$KEYSTORE_PASSWORD" \
            -storetype "$ELORA_KEYSTORE_TYPE" \
            -alias "$KEY_ALIAS" |
            grep -E "Owner:|SHA256:"


      # ============================================================
      # 16. BUILD RELEASE APK
      # ============================================================

      - name: Build release APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "=============================================="
          echo "Building Elora Dashboard 1.9.13"
          echo "=============================================="

          # The project ZIP does not contain gradlew.
          # Use the verified Gradle 8.9 installed on GitHub Runner.

          gradle \
            clean \
            assembleRelease \
            --no-daemon \
            --stacktrace

          echo ""
          echo "Release APK build completed successfully."


      # ============================================================
      # 17. LOCATE UNSIGNED APK
      # ============================================================

      - name: Locate unsigned APK
        shell: bash
        run: |
          set -euo pipefail

          OUTPUT_DIR="$PROJECT_DIR/app/build/outputs/apk/release"

          UNSIGNED_APK="$(
            find "$OUTPUT_DIR" \
              -type f \
              -name "*unsigned*.apk" \
              -print -quit
          )"

          if [ -z "$UNSIGNED_APK" ]; then
            echo "ERROR: Unsigned APK was not found."

            echo ""
            echo "Generated files:"
            find "$PROJECT_DIR/app/build/outputs" \
              -type f \
              -print || true

            exit 1
          fi

          echo "Unsigned APK:"
          echo "$UNSIGNED_APK"

          echo "UNSIGNED_APK=$UNSIGNED_APK" >> "$GITHUB_ENV"


      # ============================================================
      # 18. SIGN RELEASE APK
      # ============================================================

      - name: Sign release APK
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ELORA_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ELORA_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ELORA_KEY_ALIAS }}
        run: |
          set -euo pipefail

          echo "=============================================="
          echo "Signing release APK..."
          echo "=============================================="

          echo "Keystore type: $ELORA_KEYSTORE_TYPE"
          echo "Alias: $KEY_ALIAS"
          echo "Apksigner: $APKSIGNER"

          SIGNED_APK="$RUNNER_TEMP/Elora-Dashboard-1.9.13.apk"

          "$APKSIGNER" sign \
            --ks "$KEYSTORE_FILE" \
            --ks-type "$ELORA_KEYSTORE_TYPE" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out "$SIGNED_APK" \
            "$UNSIGNED_APK"

          if [ ! -s "$SIGNED_APK" ]; then
            echo "ERROR: Signed APK was not generated."
            exit 1
          fi

          echo "SIGNED_APK=$SIGNED_APK" >> "$GITHUB_ENV"

          echo ""
          echo "APK signing completed successfully."


      # ============================================================
      # 19. VERIFY APK SIGNATURE
      # ============================================================

      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail

          echo "Verifying APK signature..."

          "$APKSIGNER" verify \
            --verbose \
            "$SIGNED_APK"

          echo ""
          echo "APK signature verified successfully."


      # ============================================================
      # 20. FINAL APK
      # ============================================================

      - name: Final APK information
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================="
          echo "ELORA DASHBOARD 1.9.13"
          echo "=============================================="

          ls -lh "$SIGNED_APK"

          echo ""
          echo "Signed APK:"
          echo "$SIGNED_APK"


      # ============================================================
      # 21. UPLOAD APK
      # ============================================================

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Elora-Dashboard-1.9.13
          path: ${{ env.SIGNED_APK }}
          if-no-files-found: error


      # ============================================================
      # 22. GITHUB RELEASE
      # ============================================================

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.SIGNED_APK }}
          generate_release_notes: true
