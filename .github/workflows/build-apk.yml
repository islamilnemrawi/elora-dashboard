name: Build Elora Dashboard APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

env:
  JAVA_VERSION: '17'
  GRADLE_VERSION: '8.7'
  ANDROID_PLATFORM: '35'
  BUILD_TOOLS: '35.0.0'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-${ANDROID_PLATFORM}" "build-tools;${BUILD_TOOLS}"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          cache-disabled: true

      - name: Locate Elora project
        shell: bash
        run: |
          set -e

          if [ -f "settings.gradle" ] && [ -f "app/build.gradle" ]; then
            PROJECT_DIR="."
          elif [ -f "Elora_Dashboard_GitHub/settings.gradle" ] && [ -f "Elora_Dashboard_GitHub/app/build.gradle" ]; then
            PROJECT_DIR="Elora_Dashboard_GitHub"
          else
            PROJECT_DIR="$(find . -mindepth 1 -maxdepth 3 \
              -type f -name settings.gradle -print -quit \
              | xargs -r dirname)"

            if [ -z "$PROJECT_DIR" ] || \
               [ ! -f "$PROJECT_DIR/app/build.gradle" ]; then
              echo "ERROR: Elora Android project was not found."
              find . -maxdepth 4 -type f | sort
              exit 1
            fi
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Using project directory: $PROJECT_DIR"

      - name: Verify Elora project
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/elora/dashboard/MainActivity.java
          test -f app/src/main/assets/Elora_Dashboard.html
          test -f app/src/main/assets/index.html

          echo "Elora project files verified."

      - name: Build APK
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          gradle :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            --warning-mode all

      - name: Prepare APK
        shell: bash
        run: |
          set -e
          cp "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" \
             Elora-Dashboard.apk

          ls -lh Elora-Dashboard.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Elora-Dashboard-APK
          path: Elora-Dashboard.apk
          if-no-files-found: error
