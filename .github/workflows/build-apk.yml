name: Build ELORA Dashboard APK

on:
  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Signed Android APK
    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # 1) Checkout repository
      # =========================================================
      - name: Checkout repository
        uses: actions/checkout@v6

      # =========================================================
      # 2) Java 17
      # Compatible with the Elora Android project / AGP setup
      # =========================================================
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      # =========================================================
      # 3) Android SDK
      # =========================================================
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      # =========================================================
      # 4) Find the Elora Dashboard ZIP
      # =========================================================
      - name: Locate Elora Dashboard ZIP
        shell: bash
        run: |
          set -euo pipefail

          echo "Files in repository:"
          find . -maxdepth 2 -type f -print | sort

          ZIP_FILE="$(find . -maxdepth 2 -type f -name 'Elora_Dashboard_v1_9_11_PRO_FINAL.zip' | head -n 1)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Elora Dashboard ZIP was not found."
            echo "Expected file:"
            echo "Elora_Dashboard_v1_9_11_PRO_FINAL.zip"
            exit 1
          fi

          echo "Found:"
          echo "$ZIP_FILE"

          echo "ELORA_ZIP=$ZIP_FILE" >> "$GITHUB_ENV"

      # =========================================================
      # 5) Extract project
      # =========================================================
      - name: Extract Elora Dashboard project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf elora-build
          mkdir -p elora-build

          unzip -q "$ELORA_ZIP" -d elora-build

          echo "Extracted files:"
          find elora-build -maxdepth 3 -type f -print | sort | head -300

      # =========================================================
      # 6) Detect Android project root
      # =========================================================
      - name: Detect Android project
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_ROOT="$(find "$GITHUB_WORKSPACE/elora-build" \
            -type f \
            -name 'settings.gradle*' \
            -o -type f \
            -name 'gradlew' \
            | head -n 1)"

          if [ -z "$PROJECT_ROOT" ]; then
            echo "ERROR: Android Gradle project was not found after extraction."
            exit 1
          fi

          PROJECT_ROOT="$(dirname "$PROJECT_ROOT")"

          echo "Android project root:"
          echo "$PROJECT_ROOT"

          echo "ELORA_PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"

      # =========================================================
      # 7) Verify project structure
      # =========================================================
      - name: Verify Gradle project
        shell: bash
        run: |
          set -euo pipefail

          cd "$ELORA_PROJECT_ROOT"

          echo "Project:"
          pwd

          echo
          echo "Project files:"
          find . -maxdepth 2 -type f -print | sort

          if [ ! -f "./gradlew" ]; then
            echo "ERROR: gradlew was not found."
            exit 1
          fi

          if [ ! -f "./settings.gradle" ] && [ ! -f "./settings.gradle.kts" ]; then
            echo "ERROR: settings.gradle/settings.gradle.kts was not found."
            exit 1
          fi

          if [ ! -d "./app" ]; then
            echo "ERROR: Android app module was not found."
            exit 1
          fi

          chmod +x ./gradlew

      # =========================================================
      # 8) Gradle setup
      #
      # IMPORTANT:
      # Do NOT use setup-java Gradle cache here.
      # The project is extracted from ZIP after Java setup.
      # Gradle caching is handled by setup-gradle.
      # =========================================================
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # =========================================================
      # 9) Show Gradle / Java versions
      # =========================================================
      - name: Verify Java and Gradle
        shell: bash
        run: |
          set -euo pipefail

          java -version

          cd "$ELORA_PROJECT_ROOT"

          ./gradlew --version

      # =========================================================
      # 10) Decode release keystore
      # =========================================================
      - name: Prepare release signing
        shell: bash
        env:
          ELORA_KEYSTORE_BASE64: ${{ secrets.ELORA_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          if [ -z "${ELORA_KEYSTORE_BASE64:-}" ]; then
            echo "ERROR: ELORA_KEYSTORE_BASE64 secret is missing."
            exit 1
          fi

          mkdir -p "$ELORA_PROJECT_ROOT/app/keystore"

          printf '%s' "$ELORA_KEYSTORE_BASE64" \
            | base64 --decode \
            > "$ELORA_PROJECT_ROOT/app/keystore/elora-release.keystore"

          test -s "$ELORA_PROJECT_ROOT/app/keystore/elora-release.keystore"

          echo "Release keystore prepared successfully."

      # =========================================================
      # 11) Build signed Release APK
      # =========================================================
      - name: Build Release APK
        shell: bash
        env:
          ELORA_KEYSTORE_PASSWORD: ${{ secrets.ELORA_KEYSTORE_PASSWORD }}
          ELORA_KEY_ALIAS: ${{ secrets.ELORA_KEY_ALIAS }}
          ELORA_KEY_PASSWORD: ${{ secrets.ELORA_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          cd "$ELORA_PROJECT_ROOT"

          ./gradlew \
            :app:clean \
            :app:assembleRelease \
            --no-daemon \
            --stacktrace

      # =========================================================
      # 12) Locate APK
      # =========================================================
      - name: Locate generated APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find "$ELORA_PROJECT_ROOT/app/build/outputs/apk/release" \
            -type f \
            -name '*.apk' \
            | head -n 1)"

          if [ -z "$APK" ]; then
            echo "ERROR: Release APK was not generated."
            echo
            echo "APK output directory:"
            find "$ELORA_PROJECT_ROOT/app/build/outputs" \
              -type f \
              -print \
              2>/dev/null || true
            exit 1
          fi

          echo "Generated APK:"
          echo "$APK"

          mkdir -p "$GITHUB_WORKSPACE/final-apk"

          cp "$APK" \
            "$GITHUB_WORKSPACE/final-apk/Elora-Dashboard.apk"

          ls -lh "$GITHUB_WORKSPACE/final-apk/Elora-Dashboard.apk"

      # =========================================================
      # 13) Verify APK exists and is a valid ZIP/APK
      # =========================================================
      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$GITHUB_WORKSPACE/final-apk/Elora-Dashboard.apk"

          test -s "$APK"

          unzip -t "$APK" >/dev/null

          echo "APK archive verification: PASSED"
          echo "APK size:"
          ls -lh "$APK"

      # =========================================================
      # 14) Upload final APK
      # =========================================================
      - name: Upload signed APK
        uses: actions/upload-artifact@v5
        with:
          name: Elora-Dashboard-APK
          path: final-apk/Elora-Dashboard.apk
          if-no-files-found: error
          retention-days: 30

      # =========================================================
      # 15) Upload mapping file if R8 generated one
      # =========================================================
      - name: Upload release mapping
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: Elora-Dashboard-Mapping
          path: |
            ${{ env.ELORA_PROJECT_ROOT }}/app/build/outputs/mapping/release/**
          if-no-files-found: ignore
          retention-days: 30

      # =========================================================
      # 16) Cleanup signing material
      # =========================================================
      - name: Cleanup signing material
        if: always()
        shell: bash
        run: |
          set +e

          if [ -n "${ELORA_PROJECT_ROOT:-}" ]; then
            rm -f \
              "$ELORA_PROJECT_ROOT/app/keystore/elora-release.keystore"
          fi

          echo "Signing material cleanup completed."
