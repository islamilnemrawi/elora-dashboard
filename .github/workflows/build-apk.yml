name: Elora Dashboard - Build APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Elora Dashboard APK
    runs-on: ubuntu-latest

    steps:

      # ==============================
      # 1. تحميل المشروع
      # ==============================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ==============================
      # 2. اكتشاف المشروع أو ZIP
      # ==============================
      - name: Locate Android project
        id: project
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "        ELORA BUILD SYSTEM"
          echo "======================================"

          if [ -f "settings.gradle" ] || [ -f "settings.gradle.kts" ]; then
            echo "Android project found in repository root."
            echo "project_dir=." >> "$GITHUB_OUTPUT"
            exit 0
          fi

          ZIP_FILE=$(find . -maxdepth 3 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "::error::No Android project or ZIP file found."
            exit 1
          fi

          echo "ZIP detected:"
          echo "$ZIP_FILE"

          rm -rf build-project
          mkdir -p build-project

          unzip -q "$ZIP_FILE" -d build-project

          SETTINGS_FILE=$(find build-project \
            -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -print -quit)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "::error::settings.gradle was not found."
            echo "Files inside extracted project:"
            find build-project -maxdepth 4 -type f | head -100
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo "Android project:"
          echo "$PROJECT_DIR"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      # ==============================
      # 3. Java 17
      # ==============================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # ==============================
      # 4. Android SDK
      # ==============================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # ==============================
      # 5. Gradle
      # ==============================
      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
          cache-disabled: true

      # ==============================
      # 6. فحص المشروع قبل البناء
      # ==============================
      - name: Verify Elora project
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -e

          echo "Checking project files..."

          test -f settings.gradle \
            || test -f settings.gradle.kts

          test -f build.gradle \
            || test -f build.gradle.kts

          test -f app/build.gradle \
            || test -f app/build.gradle.kts

          test -f app/src/main/AndroidManifest.xml

          echo ""
          echo "Project verification: PASSED"

      # ==============================
      # 7. تنظيف أي Build قديم
      # ==============================
      - name: Clean project
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -e

          gradle \
            --no-daemon \
            clean \
            --stacktrace

      # ==============================
      # 8. بناء APK
      # ==============================
      - name: Build Elora Dashboard APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "      BUILDING ELORA DASHBOARD"
          echo "======================================"

          gradle \
            --no-daemon \
            assembleDebug \
            --stacktrace \
            --info

          echo ""
          echo "APK build completed."

      # ==============================
      # 9. البحث عن APK
      # ==============================
      - name: Verify generated APK
        id: apk
        shell: bash
        run: |
          set -e

          APK=$(find \
            "${{ steps.project.outputs.project_dir }}" \
            -type f \
            -path "*/build/outputs/apk/debug/*.apk" \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "::error::APK was not generated."
            echo ""
            echo "Searching build directory:"
            find "${{ steps.project.outputs.project_dir }}" \
              -type f \
              -name "*.apk" \
              -print

            exit 1
          fi

          echo "APK found:"
          echo "$APK"

          mkdir -p release

          cp "$APK" \
            release/Elora-Dashboard-v1.7.0-debug.apk

          echo ""
          echo "Final APK:"
          ls -lh release/Elora-Dashboard-v1.7.0-debug.apk

      # ==============================
      # 10. رفع APK كملف جاهز
      # ==============================
      - name: Upload Elora Dashboard APK
        uses: actions/upload-artifact@v4
        with:
          name: Elora-Dashboard-v1.7.0-APK
          path: release/Elora-Dashboard-v1.7.0-debug.apk
          if-no-files-found: error
          retention-days: 30

      # ==============================
      # 11. نجاح نهائي
      # ==============================
      - name: Build Success
        shell: bash
        run: |
          echo ""
          echo "======================================"
          echo "       ELORA BUILD SUCCESS"
          echo "======================================"
          echo ""
          echo "Elora Dashboard v1.7.0"
          echo "APK generated successfully."
          echo ""
