name: Elora Dashboard - Professional APK Build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: elora-dashboard-apk
  cancel-in-progress: true

jobs:
  build:
    name: Build Elora Dashboard APK
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:

      # =========================================================
      # 1) Checkout
      # =========================================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # =========================================================
      # 2) Find Dashboard ZIP
      # =========================================================
      - name: Locate Dashboard ZIP
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "Repository contents:"
          ls -lah

          mapfile -t ZIPS < <(
            find . \
              -maxdepth 2 \
              -type f \
              -iname "*.zip" \
              -print
          )

          if [ "${#ZIPS[@]}" -eq 0 ]; then
            echo "::error::No ZIP file found."
            exit 1
          fi

          if [ "${#ZIPS[@]}" -gt 1 ]; then
            echo "::error::Multiple ZIP files found."
            printf '%s\n' "${ZIPS[@]}"
            exit 1
          fi

          ZIP_FILE="${ZIPS[0]}"

          echo "Dashboard ZIP:"
          echo "$ZIP_FILE"

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"


      # =========================================================
      # 3) Validate ZIP
      # =========================================================
      - name: Validate ZIP
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "Checking ZIP integrity..."

          unzip -t "$ZIP_FILE"

          echo "ZIP integrity check passed."


      # =========================================================
      # 4) Extract Dashboard
      # =========================================================
      - name: Extract Dashboard Project
        shell: bash
        run: |
          set -Eeuo pipefail

          rm -rf extracted
          mkdir -p extracted

          unzip -q "$ZIP_FILE" -d extracted

          echo "Extraction completed."

          find extracted \
            -maxdepth 4 \
            -type f \
            -print \
            | sort \
            | head -300


      # =========================================================
      # 5) Detect Android project
      # =========================================================
      - name: Detect Android Project
        shell: bash
        run: |
          set -Eeuo pipefail

          SETTINGS_FILE="$(
            find extracted \
              -type f \
              \( \
                -name "settings.gradle" \
                -o \
                -name "settings.gradle.kts" \
              \) \
              -print \
              | head -n 1
          )"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "::error::settings.gradle was not found."

            echo "Extracted structure:"
            find extracted \
              -maxdepth 6 \
              -type f \
              -print

            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"

          echo "Android project detected:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"


      # =========================================================
      # 6) Verify Android project
      # =========================================================
      - name: Verify Android Project
        shell: bash
        run: |
          set -Eeuo pipefail

          if [ ! -d "$PROJECT_DIR/app" ]; then
            echo "::error::Android app module was not found."
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/build.gradle" ] &&
             [ ! -f "$PROJECT_DIR/build.gradle.kts" ]; then
            echo "::error::Root Gradle build file was not found."
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/settings.gradle" ] &&
             [ ! -f "$PROJECT_DIR/settings.gradle.kts" ]; then
            echo "::error::settings.gradle was not found."
            exit 1
          fi

          echo "Android project verification passed."


      # =========================================================
      # 7) Setup Java
      # =========================================================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle


      # =========================================================
      # 8) Setup Android
      # =========================================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3


      # =========================================================
      # 9) Install Android SDK
      # =========================================================
      - name: Install Android SDK
        shell: bash
        run: |
          set -Eeuo pipefail

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo "Android SDK ready."


      # =========================================================
      # 10) Setup Gradle
      # =========================================================
      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"


      # =========================================================
      # 11) Verify Java + Gradle
      # =========================================================
      - name: Verify Build Environment
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "Java:"
          java -version

          echo ""
          echo "Gradle:"
          gradle --version


      # =========================================================
      # 12) Build Debug APK
      # =========================================================
      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "========================================"
          echo " Building Elora Dashboard APK"
          echo "========================================"

          gradle \
            --no-daemon \
            --stacktrace \
            --console=plain \
            assembleDebug


      # =========================================================
      # 13) Locate APK
      # =========================================================
      - name: Locate Generated APK
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "Generated APK files:"

          find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            -print

          APK_FILE="$(
            find "$PROJECT_DIR" \
              -type f \
              -name "*.apk" \
              -print \
              | head -n 1
          )"

          if [ -z "$APK_FILE" ]; then
            echo "::error::No APK was generated."
            exit 1
          fi

          echo ""
          echo "APK found:"
          echo "$APK_FILE"

          mkdir -p release

          cp "$APK_FILE" \
            release/Elora_Dashboard.apk

          echo ""
          echo "Final APK:"
          ls -lh release/Elora_Dashboard.apk


      # =========================================================
      # 14) Upload APK
      # =========================================================
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Elora-Dashboard-APK
          path: release/Elora_Dashboard.apk
          if-no-files-found: error
          retention-days: 7
