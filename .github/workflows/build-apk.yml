name: Build Elora Dashboard APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Elora Dashboard APK
    runs-on: ubuntu-latest

    steps:
      # ==========================================
      # 1. تحميل المشروع
      # ==========================================
      - name: Checkout
        uses: actions/checkout@v4

      # ==========================================
      # 2. البحث عن ZIP وفك المشروع
      # ==========================================
      - name: Prepare Android project
        id: prepare
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "Searching for Elora project ZIP..."
          echo "======================================"

          ZIP_FILE=$(find . -type f -name "Elora_Dashboard_v1_6_0_PRO_FINAL.zip" -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "Exact ZIP not found."
            echo "Searching for any Elora Dashboard ZIP..."

            ZIP_FILE=$(find . -type f -name "Elora_Dashboard*.zip" -print -quit)
          fi

          if [ -z "$ZIP_FILE" ]; then
            echo "No ZIP found."
            echo "Checking repository for Gradle project..."

            SETTINGS_FILE=$(find . -type f -name "settings.gradle" -print -quit)

            if [ -z "$SETTINGS_FILE" ]; then
              SETTINGS_FILE=$(find . -type f -name "settings.gradle.kts" -print -quit)
            fi

            if [ -z "$SETTINGS_FILE" ]; then
              echo "ERROR: No Android/Gradle project was found."
              exit 1
            fi

            PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          else
            echo "ZIP found:"
            echo "$ZIP_FILE"

            rm -rf build-project
            mkdir -p build-project

            echo "Extracting project..."
            unzip -q "$ZIP_FILE" -d build-project

            echo "Searching for Gradle settings..."

            SETTINGS_FILE=$(find build-project -type f -name "settings.gradle" -print -quit)

            if [ -z "$SETTINGS_FILE" ]; then
              SETTINGS_FILE=$(find build-project -type f -name "settings.gradle.kts" -print -quit)
            fi

            if [ -z "$SETTINGS_FILE" ]; then
              echo "ERROR: settings.gradle was not found."
              echo ""
              echo "Gradle files found:"
              find build-project -type f -name "build.gradle" -print
              find build-project -type f -name "build.gradle.kts" -print
              exit 1
            fi

            PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          fi

          echo ""
          echo "======================================"
          echo "PROJECT DIRECTORY"
          echo "======================================"
          echo "$PROJECT_DIR"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

          echo ""
          echo "Project files:"
          find "$PROJECT_DIR" -maxdepth 2 -type f | sort | head -100

      # ==========================================
      # 3. Java 17
      # ==========================================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ==========================================
      # 4. Android SDK
      # ==========================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # ==========================================
      # 5. Android SDK 35
      # ==========================================
      - name: Install Android SDK 35
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses > /dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # ==========================================
      # 6. Gradle 8.7
      # ==========================================
      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      # ==========================================
      # 7. معلومات بيئة البناء
      # ==========================================
      - name: Show build environment
        shell: bash
        run: |
          echo "Java:"
          java -version

          echo ""
          echo "Gradle:"
          gradle --version

          echo ""
          echo "Android SDK:"
          echo "$ANDROID_HOME"

      # ==========================================
      # 8. تنظيف المشروع
      # ==========================================
      - name: Clean project
        working-directory: ${{ steps.prepare.outputs.project_dir }}
        shell: bash
        run: |
          set -e
          gradle clean

      # ==========================================
      # 9. بناء APK
      # ==========================================
      - name: Build Debug APK
        working-directory: ${{ steps.prepare.outputs.project_dir }}
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "BUILDING ELORA DASHBOARD APK"
          echo "======================================"

          gradle assembleDebug --stacktrace --info

      # ==========================================
      # 10. البحث عن APK
      # ==========================================
      - name: Locate APK
        id: apk
        shell: bash
        run: |
          set -e

          echo "Searching for generated APK..."

          APK_FILE=$(find "${{ steps.prepare.outputs.project_dir }}" -type f -name "*.apk" -print -quit)

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: APK was not generated."
            echo ""
            echo "Checking build directory:"
            find "${{ steps.prepare.outputs.project_dir }}" -type f | grep -E "\.(apk|aab)$" || true
            exit 1
          fi

          echo ""
          echo "======================================"
          echo "APK SUCCESSFULLY GENERATED"
          echo "======================================"
          echo "$APK_FILE"

          echo "apk_path=$APK_FILE" >> "$GITHUB_OUTPUT"

      # ==========================================
      # 11. إعادة تسمية APK
      # ==========================================
      - name: Rename APK
        id: rename
        shell: bash
        run: |
          set -e

          APK="${{ steps.apk.outputs.apk_path }}"
          OUTPUT="Elora-Dashboard-v1.6.0-debug.apk"

          cp "$APK" "$OUTPUT"

          echo "Final APK:"
          ls -lh "$OUTPUT"

          echo "output_path=$OUTPUT" >> "$GITHUB_OUTPUT"

      # ==========================================
      # 12. رفع APK كملف قابل للتحميل
      # ==========================================
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Elora-Dashboard-v1.6.0
          path: ${{ steps.rename.outputs.output_path }}
          if-no-files-found: error
          retention-days: 30

      # ==========================================
      # 13. ملخص البناء
      # ==========================================
      - name: Build Summary
        shell: bash
        run: |
          echo "## ✅ Elora Dashboard APK" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Version:** 1.6.0" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Build:** Debug APK" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Status:** Successfully generated" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "APK is available in the workflow Artifacts." >> "$GITHUB_STEP_SUMMARY"
