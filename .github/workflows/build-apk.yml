name: Build Elora Dashboard APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate Elora source ZIP
        shell: bash
        run: |
          set -euo pipefail

          echo "Searching repository for Elora Dashboard ZIP..."

          ZIP_FILE="$(find . -type f -name '*.zip' -print | grep -Ei 'elora[_-]dashboard' | head -n 1 || true)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Elora Dashboard ZIP not found."

            echo ""
            echo "ZIP files found in repository:"
            find . -type f -name '*.zip' -print || true

            echo ""
            echo "All repository files:"
            find . -maxdepth 4 -type f -print | sort

            exit 1
          fi

          echo "Found ZIP:"
          echo "$ZIP_FILE"

          echo "SOURCE_ZIP=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Extract Android project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf android-project
          mkdir -p android-project

          echo "Extracting:"
          echo "$SOURCE_ZIP"

          unzip -q "$SOURCE_ZIP" -d android-project

          echo ""
          echo "Extraction completed."

          find android-project -maxdepth 5 -type f -print | sort | head -300

      - name: Locate Android project
        shell: bash
        run: |
          set -euo pipefail

          echo "Searching for Gradle settings..."

          SETTINGS_FILE="$(find android-project -type f -name 'settings.gradle' -print | head -n 1 || true)"

          if [ -z "$SETTINGS_FILE" ]; then
            SETTINGS_FILE="$(find android-project -type f -name 'settings.gradle.kts' -print | head -n 1 || true)"
          fi

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle was not found."

            echo ""
            echo "Gradle files:"
            find android-project -type f \
              | grep -E '\.(gradle|gradle\.kts)$' \
              || true

            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"

          echo "Android project:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Verify Android project
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail

          echo "Project directory:"
          pwd

          echo ""
          echo "Project contents:"
          ls -la

          if [ ! -f "settings.gradle" ] && [ ! -f "settings.gradle.kts" ]; then
            echo "ERROR: settings.gradle missing."
            exit 1
          fi

          if [ ! -f "app/build.gradle" ] && [ ! -f "app/build.gradle.kts" ]; then
            echo "ERROR: app/build.gradle missing."
            exit 1
          fi

          if [ ! -f "app/src/main/AndroidManifest.xml" ]; then
            echo "ERROR: AndroidManifest.xml missing."
            exit 1
          fi

          echo ""
          echo "Android project verification: OK"

      - name: Validate AndroidManifest.xml
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import xml.etree.ElementTree as ET

          manifest = "app/src/main/AndroidManifest.xml"

          ET.parse(manifest)

          print("AndroidManifest.xml: VALID")
          PY

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify Gradle
        shell: bash
        run: |
          set -euo pipefail

          echo "Gradle:"
          gradle --version

      - name: Build Debug APK
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail

          echo "======================================"
          echo "Building Elora Dashboard v1.9.3"
          echo "======================================"

          gradle clean assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Locate generated APK
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail

          APK_FILE="$(find app/build/outputs/apk -type f -name '*.apk' -print | head -n 1 || true)"

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: APK was not generated."

            echo ""
            echo "Build output:"
            find app/build -type f -print | sort || true

            exit 1
          fi

          echo "APK generated successfully:"
          ls -lh "$APK_FILE"

          mkdir -p "$GITHUB_WORKSPACE/release"

          cp "$APK_FILE" \
            "$GITHUB_WORKSPACE/release/Elora-Dashboard-v1.9.3.apk"

      - name: Verify final APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$GITHUB_WORKSPACE/release/Elora-Dashboard-v1.9.3.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: Final APK not found."
            exit 1
          fi

          if [ ! -s "$APK" ]; then
            echo "ERROR: Final APK is empty."
            exit 1
          fi

          echo ""
          echo "======================================"
          echo "ELORA DASHBOARD APK READY"
          echo "======================================"

          ls -lh "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Elora-Dashboard-v1.9.3
          path: release/Elora-Dashboard-v1.9.3.apk
          if-no-files-found: error
          retention-days: 14
