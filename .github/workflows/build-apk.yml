name: Build Elora Dashboard PRO

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Sign Verify Elora Dashboard PRO
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:

      - name: Checkout
        uses: actions/checkout@v6


      - name: Find and extract PRO
        shell: bash
        run: |
          set -euo pipefail

          echo "Searching for Elora Dashboard PRO ZIP..."

          ZIP_FILE=$(find . -maxdepth 5 -type f -name 'Elora_Dashboard*.zip' | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Elora Dashboard PRO ZIP was not found."
            echo ""
            echo "ZIP files found:"
            find . -maxdepth 5 -type f -name '*.zip' -print
            exit 1
          fi

          echo "Using:"
          echo "$ZIP_FILE"

          rm -rf android-project
          mkdir -p android-project

          unzip -q "$ZIP_FILE" -d android-project

          echo ""
          echo "Searching for Android project..."

          SETTINGS_FILE=$(find android-project -type f -name 'settings.gradle' | head -n 1)

          if [ -z "$SETTINGS_FILE" ]; then
            SETTINGS_FILE=$(find android-project -type f -name 'settings.gradle.kts' | head -n 1)
          fi

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: Android settings file was not found."
            echo ""
            echo "Extracted files:"
            find android-project -maxdepth 6 -type f -print
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo "PROJECT_DIR=$PROJECT_DIR"

          if [ ! -f "$PROJECT_DIR/app/build.gradle" ] && [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "ERROR: app build.gradle was not found."
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml" ]; then
            echo "ERROR: AndroidManifest.xml was not found."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"


      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle


      - name: Set up Android SDK
        uses: android-actions/setup-android@v4


      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"


      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'


      - name: Prepare release keystore
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ELORA_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          if [ -z "$KEYSTORE_B64" ]; then
            echo "ERROR: ELORA_KEYSTORE_BASE64 secret is missing."
            exit 1
          fi

          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/elora-release.keystore"

          if [ ! -s "$RUNNER_TEMP/elora-release.keystore" ]; then
            echo "ERROR: Keystore is empty."
            exit 1
          fi

          echo "ELORA_KEYSTORE_FILE=$RUNNER_TEMP/elora-release.keystore" >> "$GITHUB_ENV"

          echo "Release keystore prepared."


      - name: Build Release APK
        shell: bash
        env:
          ELORA_KEYSTORE_PASSWORD: ${{ secrets.ELORA_KEYSTORE_PASSWORD }}
          ELORA_KEY_ALIAS: ${{ secrets.ELORA_KEY_ALIAS }}
          ELORA_KEY_PASSWORD: ${{ secrets.ELORA_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "Building Elora Dashboard PRO..."

          gradle --no-daemon --stacktrace clean assembleRelease

          echo ""
          echo "Build completed."

          echo ""
          echo "Generated APK files:"
          find . -type f -name '*.apk' -print


      - name: Locate unsigned APK
        shell: bash
        run: |
          set -euo pipefail

          UNSIGNED_APK=$(find "$PROJECT_DIR" -type f -name '*-unsigned.apk' | head -n 1)

          if [ -z "$UNSIGNED_APK" ]; then
            echo "ERROR: Unsigned APK was not found."

            echo ""
            echo "All APK files:"
            find "$PROJECT_DIR" -type f -name '*.apk' -print || true

            exit 1
          fi

          echo "Unsigned APK:"
          echo "$UNSIGNED_APK"

          echo "ELORA_UNSIGNED_APK=$UNSIGNED_APK" >> "$GITHUB_ENV"


      - name: Sign APK
        shell: bash
        env:
          ELORA_KEYSTORE_PASSWORD: ${{ secrets.ELORA_KEYSTORE_PASSWORD }}
          ELORA_KEY_ALIAS: ${{ secrets.ELORA_KEY_ALIAS }}
          ELORA_KEY_PASSWORD: ${{ secrets.ELORA_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          SIGNED_APK="$RUNNER_TEMP/Elora-Dashboard-PRO.apk"

          echo "Signing APK..."

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks "$ELORA_KEYSTORE_FILE" \
            --ks-key-alias "$ELORA_KEY_ALIAS" \
            --ks-pass "pass:$ELORA_KEYSTORE_PASSWORD" \
            --key-pass "pass:$ELORA_KEY_PASSWORD" \
            --out "$SIGNED_APK" \
            "$ELORA_UNSIGNED_APK"

          if [ ! -s "$SIGNED_APK" ]; then
            echo "ERROR: Signed APK was not created."
            exit 1
          fi

          echo ""
          echo "Signed APK created:"
          ls -lh "$SIGNED_APK"

          echo "ELORA_SIGNED_APK=$SIGNED_APK" >> "$GITHUB_ENV"


      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          echo "Verifying APK signature..."

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            verify \
            --verbose \
            "$ELORA_SIGNED_APK"

          echo ""
          echo "=========================================="
          echo "APK SIGNATURE VERIFIED SUCCESSFULLY"
          echo "=========================================="


      - name: Show APK information
        shell: bash
        run: |
          set -euo pipefail

          echo "APK:"
          echo "$ELORA
