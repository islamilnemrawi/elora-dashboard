name: Build Elora Dashboard v1.9.13 PRO

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  build:
    name: Build Elora Dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Android SDK
        shell: bash
        run: |
          set -euo pipefail

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          if [[ -z "${ANDROID_HOME:-}" ]]; then
            echo "ERROR: ANDROID_HOME is not configured."
            exit 1
          fi

          if [[ ! -d "$ANDROID_HOME" ]]; then
            echo "ERROR: Android SDK directory does not exist."
            exit 1
          fi

          echo ""
          echo "Android SDK detected successfully."

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [[ ! -x "$SDKMANAGER" ]]; then
            SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
              -type f \
              -name sdkmanager \
              -print \
              | head -n 1 || true)
          fi

          if [[ -z "$SDKMANAGER" || ! -x "$SDKMANAGER" ]]; then
            echo "ERROR: sdkmanager was not found."
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo ""
          echo "Android SDK packages installed."

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-disabled: true

      - name: Locate Elora Android project
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Searching for Elora Android project..."
          echo "========================================"

          if [[ -f "$GITHUB_WORKSPACE/settings.gradle" &&
                -f "$GITHUB_WORKSPACE/app/build.gradle" ]]; then

            echo "Android project found in repository root."

            echo "PROJECT_DIR=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"

            exit 0
          fi

          ZIP_FILE=""

          while IFS= read -r -d '' file; do

            echo "Checking archive:"
            echo "$file"

            if unzip -l "$file" 2>/dev/null |
              grep -qE '(^|/)settings\.gradle$' &&
              unzip -l "$file" 2>/dev/null |
              grep -qE '(^|/)app/build\.gradle$'; then

              ZIP_FILE="$file"

              echo "Valid Android project found:"
              echo "$ZIP_FILE"

              break
            fi

          done < <(
            find "$GITHUB_WORKSPACE" \
              -type f \
              -name "*.zip" \
              ! -path "*/.git/*" \
              -print0
          )

          if [[ -z "$ZIP_FILE" ]]; then

            echo ""
            echo "ERROR: No valid Elora Android project ZIP was found."
            echo ""

            echo "Available ZIP files:"
            find "$GITHUB_WORKSPACE" \
              -type f \
              -name "*.zip" \
              ! -path "*/.git/*" \
              -print || true

            exit 1
          fi

          EXTRACT_DIR="$GITHUB_WORKSPACE/_elora_project"

          rm -rf "$EXTRACT_DIR"
          mkdir -p "$EXTRACT_DIR"

          echo ""
          echo "Extracting:"
          echo "$ZIP_FILE"

          unzip -q "$ZIP_FILE" -d "$EXTRACT_DIR"

          SETTINGS_FILE=$(
            find "$EXTRACT_DIR" \
              -type f \
              -name "settings.gradle" \
              -print \
              | head -n 1
          )

          if [[ -z "$SETTINGS_FILE" ]]; then
            echo "ERROR: settings.gradle was not found after extraction."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"

          if [[ ! -f "$PROJECT_DIR/app/build.gradle" ]]; then
            echo "ERROR: app/build.gradle was not found."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo ""
          echo "========================================"
          echo "Elora project located successfully"
          echo "========================================"
          echo "$PROJECT_DIR"

      - name: Verify Elora project
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          REQUIRED_FILES=(
            "settings.gradle"
            "build.gradle"
            "app/build.gradle"
            "app/src/main/AndroidManifest.xml"
            "app/src/main/java/com/elora/dashboard/MainActivity.java"
            "app/src/main/assets/Elora_Dashboard.html"
            "app/src/main/assets/index.html"
          )

          for FILE in "${REQUIRED_FILES[@]}"; do
            if [[ ! -f "$FILE" ]]; then
              echo "ERROR: Missing required file:"
              echo "$FILE"
              exit 1
            fi
          done

          echo "Elora project verification passed."

      - name: Verify application version
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          grep -Eq \
            "applicationId[[:space:]]+['\"]com\.elora\.dashboard['\"]" \
            app/build.gradle

          grep -Eq \
            "versionCode[[:space:]]+19" \
            app/build.gradle

          grep -Eq \
            "versionName[[:space:]]+['\"]1\.9\.13['\"]" \
            app/build.gradle

          echo "Application ID : com.elora.dashboard"
          echo "Version Code   : 19"
          echo "Version Name   : 1.9.13"

      - name: Check release signing secrets
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ELORA_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ELORA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ELORA_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ELORA_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          [[ -n "$KEYSTORE_B64" ]] || {
            echo "ERROR: Missing ELORA_KEYSTORE_BASE64"
            exit 1
          }

          [[ -n "$KEYSTORE_PASSWORD" ]] || {
            echo "ERROR: Missing ELORA_KEYSTORE_PASSWORD"
            exit 1
          }

          [[ -n "$KEY_ALIAS" ]] || {
            echo "ERROR: Missing ELORA_KEY_ALIAS"
            exit 1
          }

          [[ -n "$KEY_PASSWORD" ]] || {
            echo "ERROR: Missing ELORA_KEY_PASSWORD"
            exit 1
          }

          echo "All signing secrets are available."

      - name: Restore release keystore
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ELORA_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          KEYSTORE_FILE="$RUNNER_TEMP/elora-release.keystore"

          printf '%s' "$KEYSTORE_B64" |
            base64 --decode |
            tr -d '\r\n' >
            "$KEYSTORE_FILE"

          if [[ ! -s "$KEYSTORE_FILE" ]]; then
            echo "ERROR: Keystore file is empty."
            exit 1
          fi

          echo "ELORA_KEYSTORE_FILE=$KEYSTORE_FILE" >> "$GITHUB_ENV"

          echo "Release keystore restored successfully."

      - name: Build release APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "========================================"
          echo "Building Elora Dashboard v1.9.13"
          echo "========================================"

          gradle \
            clean \
            assembleRelease \
            --no-daemon \
            --stacktrace \
            --warning-mode all

      - name: Locate release APK
        shell: bash
        run: |
          set -euo pipefail

          APK_DIR="$PROJECT_DIR/app/build/outputs/apk/release"

          APK_FILE=$(
            find "$APK_DIR" \
              -type f \
              -name "*.apk" \
              ! -name "*unsigned*" \
              -print \
              | head -n 1
          )

          if [[ -z "$APK_FILE" ]]; then

            echo "ERROR: Release APK was not generated."

            echo ""
            echo "Generated APK files:"
            find "$PROJECT_DIR/app/build/outputs" \
              -type f \
              -name "*.apk" \
              -print || true

            exit 1
          fi

          echo "ELORA_APK=$APK_FILE" >> "$GITHUB_ENV"

          echo ""
          echo "APK found:"
          echo "$APK_FILE"

      - name: Sign APK
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ELORA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ELORA_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ELORA_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          SIGNED_APK="$RUNNER_TEMP/Elora-Dashboard-v1.9.13.apk"

          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"

          if [[ ! -x "$APKSIGNER" ]]; then
            echo "ERROR: apksigner not found."
            exit 1
          fi

          "$APKSIGNER" sign \
            --ks "$ELORA_KEYSTORE_FILE" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out "$SIGNED_APK" \
            "$ELORA_APK"

          if [[ ! -s "$SIGNED_APK" ]]; then
            echo "ERROR: Signed APK was not created."
            exit 1
          fi

          echo "ELORA_SIGNED_APK=$SIGNED_APK" >> "$GITHUB_ENV"

          echo "APK signed successfully."

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"

          echo "Checking APK signature..."

          "$APKSIGNER" \
            verify \
            --verbose \
            "$ELORA_SIGNED_APK"

          echo ""
          echo "Checking package information..."

          PACKAGE_INFO=$(
            "$AAPT" \
              dump badging \
              "$ELORA_SIGNED_APK"
          )

          echo "$PACKAGE_INFO" |
            grep -E "package:"

          echo "$PACKAGE_INFO" |
            grep -q "name='com.elora.dashboard'"

          echo "$PACKAGE_INFO" |
            grep -q "versionCode='19'"

          echo "$PACKAGE_INFO" |
            grep -q "versionName='1.9.13'"

          echo ""
          echo "========================================"
          echo "APK signature and version verified."
          echo "========================================"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Elora-Dashboard-v1.9.13-PRO
          path: ${{ env.ELORA_SIGNED_APK }}
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.9.13
          name: Elora Dashboard v1.9.13 PRO
          generate_release_notes: true
          files: ${{ env.ELORA_SIGNED_APK }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
