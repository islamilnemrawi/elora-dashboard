name: Build Elora Dashboard APK

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      # --------------------------------------------------
      # 1. Checkout repository
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. Find Elora Dashboard source ZIP
      # --------------------------------------------------
      - name: Locate source ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE=""

          for file in Elora_Dashboard*.zip Elora-Dashboard*.zip; do
            if [ -f "$file" ]; then
              ZIP_FILE="$file"
              break
            fi
          done

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Elora Dashboard source ZIP was not found."
            echo "Repository files:"
            ls -lah
            exit 1
          fi

          echo "Found source ZIP:"
          echo "$ZIP_FILE"

          echo "ELORA_ZIP=$ZIP_FILE" >> "$GITHUB_ENV"

      # --------------------------------------------------
      # 3. Extract Android project
      # --------------------------------------------------
      - name: Extract Android project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf android-project
          mkdir -p android-project

          unzip -q "$ELORA_ZIP" -d android-project

          echo "Extracted files:"
          find android-project -maxdepth 4 -type f | sort | head -200

      # --------------------------------------------------
      # 4. Locate settings.gradle
      # --------------------------------------------------
      - name: Locate Gradle project
        shell: bash
        run: |
          set -euo pipefail

          SETTINGS_FILE=$(find android-project \
            -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -print -quit)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle was not found."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo "Gradle project:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # --------------------------------------------------
      # 5. Setup Java 17
      # --------------------------------------------------
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # --------------------------------------------------
      # 6. Setup Android SDK
      # --------------------------------------------------
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # --------------------------------------------------
      # 7. Install Android SDK packages
      # --------------------------------------------------
      - name: Install Android SDK 35
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # --------------------------------------------------
      # 8. Setup Gradle 8.9
      # --------------------------------------------------
      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
          cache-disabled: true

      # --------------------------------------------------
      # 9. Verify project
      # --------------------------------------------------
      - name: Verify Android project
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail

          echo "Working directory:"
          pwd

          echo
          echo "Project files:"
          ls -lah

          echo
          echo "Gradle version:"
          gradle --version

          echo
          echo "Android SDK:"
          echo "$ANDROID_HOME"

          echo
          echo "Java:"
          java -version

          echo
          echo "Checking app module..."

          if [ ! -d "app" ]; then
            echo "ERROR: app module was not found."
            exit 1
          fi

      # --------------------------------------------------
      # 10. Build Debug APK
      # --------------------------------------------------
      - name: Build Debug APK
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail

          gradle \
            --no-daemon \
            --stacktrace \
            --warning-mode all \
            clean \
            assembleDebug

      # --------------------------------------------------
      # 11. Find generated APK
      # --------------------------------------------------
      - name: Locate generated APK
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail

          echo "Searching for APK..."

          find . \
            -type f \
            -name "*.apk" \
            -print

          APK=$(find app/build/outputs/apk/debug \
            -type f \
            -name "*.apk" \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo
          echo "APK generated successfully:"
          ls -lh "$APK"

          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      # --------------------------------------------------
      # 12. Rename APK
      # --------------------------------------------------
      - name: Prepare APK
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail

          mkdir -p "$GITHUB_WORKSPACE/release"

          cp "$APK_PATH" \
            "$GITHUB_WORKSPACE/release/Elora-Dashboard-v1.9.6.apk"

          echo "Final APK:"
          ls -lh "$GITHUB_WORKSPACE/release/Elora-Dashboard-v1.9.6.apk"

      # --------------------------------------------------
      # 13. Upload APK artifact
      # --------------------------------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Elora-Dashboard-v1.9.6
          path: release/Elora-Dashboard-v1.9.6.apk
          if-no-files-found: error
          retention-days: 30
