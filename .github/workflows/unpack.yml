name: Prepare Elora Dashboard Android

on:
  workflow_dispatch:

jobs:
  prepare:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find and extract Android ZIP
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 2 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found"
            exit 1
          fi

          echo "Found ZIP: $ZIP_FILE"

          mkdir -p /tmp/elora
          unzip -q "$ZIP_FILE" -d /tmp/elora

          echo "Extracted files:"
          find /tmp/elora -maxdepth 4 -type f | head -100

          PROJECT_DIR=$(find /tmp/elora -name settings.gradle -type f -print -quit | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: settings.gradle not found"
            exit 1
          fi

          echo "Android project found at: $PROJECT_DIR"

          cp -R "$PROJECT_DIR"/. .

          rm -f "$ZIP_FILE"

          echo "Final project structure:"
          ls -la
          echo
          echo "Checking required files..."

          test -f "settings.gradle"
          test -f "build.gradle"
          test -f "app/build.gradle"
          test -f ".github/workflows/build-apk.yml"

          echo "SUCCESS: Android project is correctly arranged."
